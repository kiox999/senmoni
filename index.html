/* ---------- result ---------- */
function renderResult(){
  var s = S.session; if(!s){ go('home'); return; }
  if(s.examResult){ renderExamResult(s); return; }
  var ok = s.res.filter(function(r){ return r.ok; }).length;
  var wrong = s.res.filter(function(r){ return !r.ok; });
  var secs = s.res.reduce(function(a,r){ return a+r.sec; },0);
  var avg = s.res.length ? Math.round(secs/s.res.length) : 0;
  var h = '';
  h += '<div class="kicker" style="margin-top:10px">'+(s.reviewing?'REVIEW COMPLETE':'SESSION COMPLETE')+'</div>';
  h += '<h1 style="margin:6px 0 10px">'+(s.reviewing?'復習おつかれさまでした':'セッション完了')+'</h1>';
  h += '<div style="display:flex;align-items:baseline;gap:10px"><span class="big">'+ok+'/'+s.res.length+'</span><span class="mono" style="margin-left:auto;font-weight:700;font-size:20px;color:var(--accent)">'+(s.res.length?Math.round(100*ok/s.res.length):0)+'%</span></div>';
  h += '<div class="sub">平均解答時間 '+avg+'秒 ／ 所要 '+Math.floor(secs/60)+'分'+(secs%60)+'秒</div>';
  var bc = s.bestCombo||0, bt = comboTier(bc);
  h += '<div class="statrow" style="margin:16px 0 12px"><div class="statbox"><b>+'+(s.gained||0)+'</b><div class="label">獲得XP</div></div>'
     + '<div class="statbox sk-'+curSkin()+(bt?' bcbox '+bt.cls:'')+'"><b>'+bc+'</b><div class="label">最高コンボ'+(bt?' ×'+bt.mult.toFixed(1):'')+'</div></div>'
     + '<div class="statbox"><b>'+S.xp+'</b><div class="label">使えるXP</div></div></div>';
  h += '<div class="soft">'+(s.reviewing ? (wrong.length ? '残り'+wrong.length+'問はまた出題されます。' : 'すべて正解。復習リストから外れました。') : (wrong.length ? '誤答'+wrong.length+'問。続けて復習すると定着しやすくなります。' : '全問正解。次は新しい分野に進みましょう。'))+'</div>';
  /* 出題した全問を一覧表示する。正解した問題でも自信がなければ見返せるように、
     結果画面から個別に開けて、★でマークもできる。 */
  if(s.taOver) h += '<div class="tanote">Time attack 終了。'+(s.taMin||10)+'分で <b>'+s.res.length+'問</b> 解答しました。</div>';
  h += '<h2>この'+s.res.length+'問</h2>';
  h += '<div class="reslist">';
  s.res.forEach(function(r){
    var q = QUESTIONS.filter(function(x){ return x.id===r.id; })[0];
    if(!q) return;
    var mk = !!(S.marks && S.marks[q.id]);
    h += '<div class="resli'+(r.ok?'':' ng')+'">'
       +   '<button class="resmk'+(mk?' on':'')+'" data-mark="'+q.id+'" title="あとで見返す">'+(mk?'★':'☆')+'</button>'
       +   '<button class="resopen" data-open="'+q.id+'">'
       +     '<span class="resj">'+(r.ok?'○':'✕')+'</span>'
       +     '<span class="resq">'+esc(q.stem.slice(0,30))+(q.stem.length>30?'…':'')+'</span>'
       +     '<span class="n">'+letterOf(q.category)+'</span>'
       +     '<span class="n" style="color:var(--soft)">#'+q.id+'</span>'
       +   '</button>'
       + '</div>';
  });
  h += '</div>';
  h += '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">';
  if(wrong.length) h += '<button class="cta" data-act="review">間違えた'+wrong.length+'問をいま復習する</button>';
  var marked = s.res.filter(function(r){ return S.marks && S.marks[r.id]; });
  if(marked.length) h += '<button class="ghost" data-act="reviewmark">★を付けた'+marked.length+'問を復習する</button>';
  h += '<button class="ghost" data-act="again">'+(S.timeatk ? 'もう一度 '+(S.taMin||10)+'分' : '同じ条件でもう'+S.count+'問')+'</button><button class="ghost" data-act="home">'+(qaBack?'一問一答に戻る':'ホームへ')+'</button></div><div style="height:20px"></div>';
  main.innerHTML = h;

  main.onclick = function(e){
    var mk = e.target.closest('[data-mark]');
    if(mk){
      var mid = parseInt(mk.dataset.mark,10);
      if(!S.marks) S.marks = {};
      if(S.marks[mid]) delete S.marks[mid]; else S.marks[mid] = 1;
      save(); renderResult(); return;
    }
    var o = e.target.closest('[data-open]'); if(o){ startSession([parseInt(o.dataset.open,10)], true); return; }
    var a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='review'){ startSession(wrong.map(function(r){ return r.id; }), true); }
    if(a.dataset.act==='reviewmark'){ startSession(marked.map(function(r){ return r.id; }), true); }
    if(a.dataset.act==='again'){ startSession(buildQueue(), false); }
    if(a.dataset.act==='home'){
      S.session=null; save();
      /* 一問一答から来た場合はそこへ戻す */
      if(qaBack){ qaBack = false; qaOn = true; }
      go('home');
    }
  };
}

/* ---------- stats ---------- */
var searchQ = '';
function searchResultsHtml(){
  var qraw = searchQ.trim();
  if(!qraw) return '';
  var idMatch = qraw.match(/^#?(\d+)$/);
  var hits;
  if(idMatch){
    var wantId = parseInt(idMatch[1],10);
    hits = QUESTIONS.filter(function(q){ return q.id===wantId; });
  } else {
    hits = QUESTIONS.filter(function(q){ return (q.stem+q.explanation+(q.deepdive||'')).toLowerCase().indexOf(qraw.toLowerCase())>=0; }).slice(0,20);
  }
  return '<div class="list">' + (hits.length ? hits.map(function(q){
    return '<div class="li" data-open="'+q.id+'"><span style="flex:1">'+esc(q.stem.slice(0,34))+(q.stem.length>34?'…':'')+'</span><span class="n">'+letterOf(q.category)+'</span><span class="n" style="color:var(--soft)">#'+q.id+'</span></div>';
  }).join('') : '<div class="li" style="color:var(--soft)">見つかりませんでした</div>') + '</div>';
}
function renderStats(){
  var seen = 0, ok = 0, bm = 0;
  QUESTIONS.forEach(function(q){ var p=S.prog[q.id]; if(p&&p.seen){ seen++; if(p.lastOk) ok++; } if(p&&p.bm) bm++; });
  var acc = accByCat();
  var wrongs = QUESTIONS.filter(function(q){ var p=S.prog[q.id]; return p && p.seen && !p.lastOk; });
  var h = '';
  h += '<h1 style="margin:8px 0 14px">成績</h1>';
  h += '<div class="statrow" style="margin-bottom:16px"><div class="statbox"><b>'+seen+'</b><div class="label">解答済み</div></div><div class="statbox"><b style="color:var(--accent)">'+(seen?Math.round(100*ok/seen):0)+'%</b><div class="label">正答率</div></div><div class="statbox"><b>'+wrongs.length+'</b><div class="label">要復習</div></div></div>';

  h += '<h2>学習履歴（14日）</h2><div class="card" style="margin-bottom:4px">';
  var max = 1, days = [], total7 = 0, todayCount = 0;
  for(var i=13;i>=0;i--){ var d = new Date(Date.now()-i*DAY); var e = S.hist[todayKey(d)] || {a:0,c:0}; days.push(e); if(e.a>max) max=e.a; if(i<7) total7+=e.a; if(i===0) todayCount=e.a; }
  h += '<div class="statrow" style="margin-bottom:12px"><div class="statbox"><b>'+todayCount+'</b><div class="label">今日</div></div><div class="statbox"><b>'+total7+'</b><div class="label">直近7日</div></div></div>';
  h += '<div class="bars">';
  days.forEach(function(e){
    var pct = Math.round(100*e.a/max);
    var col = e.a===0 ? 'var(--barIdle)' : (e.a>=max*0.8 ? 'var(--accent)' : 'var(--barMid)');
    h += '<div class="barcol"><span class="barnum">'+(e.a>0?e.a:'')+'</span><i style="height:'+Math.max(4,pct)+'%;background:'+col+'"></i></div>';
  });
  h += '</div><div class="axis"><span>14日前</span><span>今日</span></div></div>';

  if(S.log && S.log.length){
    h += '<details id="histDetails"><summary>直近の解答履歴（'+Math.min(20,S.log.length)+'）</summary><div class="list">';
    S.log.slice(0,20).forEach(function(r){
      var q = QUESTIONS.filter(function(x){ return x.id===r.id; })[0];
      if(!q) return;
      var t = new Date(r.ts);
      var tstr = (t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
      h += '<div class="li" data-open="'+q.id+'">'
         + '<span class="glyph" style="flex:0 0 auto;color:'+(r.ok?'var(--good)':'var(--bad)')+'">'+(r.ok?'○':'✕')+'</span>'
         + '<span style="flex:1">'+esc(q.stem.slice(0,30))+(q.stem.length>30?'…':'')+'</span>'
         + '<span class="n">'+letterOf(q.category)+'</span>'
         + '<span class="n" style="color:var(--soft)">'+tstr+'</span>'
         + '</div>';
    });
    h += '</div></details>';
  }

  var touched = CATS.filter(function(c){ return acc[c].seen>0; }).length;
  h += '<details id="heatDetails"'+(heatOpen?' open':'')+'><summary>分野別の到達度（'+touched+' / '+CATS.length+'分野）</summary>';
  h += '<div class="heat" style="margin-top:10px">';
  CATS.forEach(function(c){
    var d = acc[c], rate = d.seen ? Math.round(100*d.ok/d.seen) : null;
    var col = heatColor(rate) || 'var(--line)';
    h += '<div data-cat="'+esc(c)+'" style="background:var(--card);border:1.5px solid '+col+';color:var(--ink)">'+esc(c)+'<span style="color:var(--soft)">'+(rate===null?'—':rate+'%')+'</span></div>';
  });
  h += '</div><div class="sub" style="margin-top:8px">タップするとその分野を出題します</div></details>';

  if(bm){
    var bmQs = QUESTIONS.filter(function(q){ var p=S.prog[q.id]; return p&&p.bm; });
    var setColors = {1:'#E8A100', 2:'#E02418', 3:'#1B5FC1'};
    h += '<details id="bmDetails"><summary>ブックマーク（'+bm+'）</summary><div class="sub" style="margin:8px 0 8px">問題画面の☆をタップすると黄→赤→青→解除の順で切り替わります。名前の右の✎で名前を変更できます。</div>';
    [1,2,3].forEach(function(setId){
      var list = bmQs.filter(function(q){ return S.prog[q.id].bm===setId; });
      if(!list.length) return;
      var nm = esc(S.bmNames[setId] || ('セット'+setId));
      h += '<div class="bmgroup"><div class="bmhead"><b style="color:'+setColors[setId]+'">★ '+nm+'</b><span style="flex:1"></span><button class="bmrename" data-rename="'+setId+'" title="名前を変更">✎</button><span class="n">'+list.length+'問</span></div><div class="list">';
      list.forEach(function(q){
        h += '<div class="li" data-open="'+q.id+'"><span style="flex:1">'+esc(q.stem.slice(0,30))+(q.stem.length>30?'…':'')+'</span><span class="n">'+letterOf(q.category)+'</span><span class="n" style="color:var(--soft)">#'+q.id+'</span></div>';
      });
      h += '</div><div style="margin-top:8px"><button class="ghost" data-act="bmrun" data-set="'+setId+'">この'+list.length+'問をまとめて解く</button></div></div>';
    });
    h += '</details>';
  }

  if(S.feedback && S.feedback.length){
    h += '<details id="fbDetails"><summary>問題のメモ（'+S.feedback.length+'）</summary>';
    h += '<div class="sub" style="margin:8px 0 8px">メモと写真はこの端末に保存されています。行をタップするとその問題を解き直せます。✎で編集、「全部コピー」で文章をまとめて書き出せます。</div>';
    h += '<div class="list" style="margin-bottom:10px">';
    S.feedback.slice().reverse().forEach(function(f, ridx){
      var idx = S.feedback.length - 1 - ridx;
      var t = new Date(f.ts);
      var tstr = (t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
      var np = (f.photos && f.photos.length) ? f.photos.length : 0;
      h += '<div class="li fbli" style="align-items:flex-start">'
         + '<span style="flex:1" data-open="'+f.id+'">'
         + '<span class="n" style="color:var(--accent)">#'+f.id+'</span> '
         + '<span style="font-size:10px;color:var(--soft)">'+tstr+'</span>'
         + (np ? '<span class="fbph">写真'+np+'</span>' : '')
         + '<div style="margin-top:3px">'+esc(f.text)+'</div>'
         + (np ? '<div class="fbthumbs" data-fbi="'+idx+'"></div>' : '')
         + '</span>'
         + '<button class="fbedit" data-editfb="'+idx+'" title="編集">✎</button>'
         + '<button class="fbdel" data-delfb="'+idx+'" title="削除">✕</button></div>';
    });
    h += '</div><button class="ghost" data-act="copyfb">全部コピー</button></details>';
    setTimeout(loadFbThumbs, 0);   /* 描画後に写真を読み込む */
  }

  if(wrongs.length){
    h += '<details id="wrongDetails"><summary>間違えた問題（'+wrongs.length+'）</summary><div class="list">';
    wrongs.slice(0,20).forEach(function(q){
      h += '<div class="li" data-open="'+q.id+'"><span style="flex:1">'+esc(q.stem.slice(0,34))+(q.stem.length>34?'…':'')+'</span><span class="n">'+letterOf(q.category)+'</span><span class="n" style="color:var(--soft)">#'+q.id+'</span></div>';
    });
    h += '</div><div style="margin-top:12px"><button class="cta" data-act="wrongrun">間違えた問題だけ出題する</button></div></details>';
  }
  h += '<div style="height:20px"></div>';
  main.innerHTML = h;

  main.onclick = function(e){
    var ex = e.target.closest('[data-exam]');
    if(ex){ var r = rankById(parseInt(ex.dataset.exam,10)); if(r) startExam(r); return; }
    var ce = e.target.closest('[data-cert]');
    if(ce){
      var rec = (S.examLog||[])[parseInt(ce.dataset.cert,10)];
      if(rec && rec.passed) showCert(rec);
      return;
    }
    var c = e.target.closest('[data-cat]');
    if(c){ var cat=c.dataset.cat; var ids = QUESTIONS.filter(function(q){ return q.category===cat; }).map(function(q){return q.id;}); startSession(shuffle(ids).slice(0,S.count), false); return; }
    var o = e.target.closest('[data-open]'); if(o){ startSession([parseInt(o.dataset.open,10)], true); return; }
    var rn = e.target.closest('[data-rename]');
    var ef = e.target.closest('[data-editfb]');
    if(ef){ openMemo(S.feedback[parseInt(ef.dataset.editfb,10)].id, parseInt(ef.dataset.editfb,10)); return; }
    if(rn){ var sid = parseInt(rn.dataset.rename,10); var cur = S.bmNames[sid] || ('セット'+sid); var nv = prompt('この色のブックマークの名前を入力してください', cur); if(nv!==null && nv.trim()){ S.bmNames[sid] = nv.trim().slice(0,20); save(); renderStats(); } return; }
    var delfb = e.target.closest('[data-delfb]');
    if(delfb){ var didx = parseInt(delfb.dataset.delfb,10); S.feedback.splice(didx,1); save(); renderStats(); return; }
    var a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='wrongrun') startSession(shuffle(wrongs.map(function(q){return q.id;})).slice(0,50), true);
    if(a.dataset.act==='bmrun'){
      var setFilter = a.dataset.set ? parseInt(a.dataset.set,10) : null;
      var ids = QUESTIONS.filter(function(q){ var p=S.prog[q.id]; return p && p.bm && (setFilter===null || p.bm===setFilter); }).map(function(q){return q.id;});
      startSession(ids, true);
    }
    if(a.dataset.act==='copyfb'){
      var txt = S.feedback.map(function(f){ return '#'+f.id+': '+f.text; }).join('\n');
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ alert('コピーしました'); }, function(){ prompt('コピーできませんでした。手動でコピーしてください:', txt); });
      } else {
        prompt('以下をコピーしてください:', txt);
      }
    }
  };
}

<script>
/* 埋め込み表示ではブラウザ標準の confirm / alert / prompt が表示されないため、画面内のダイアログに置き換える。
   confirm と prompt は同期で値を返す必要があるので、最初の呼び出しではダイアログを出して false / null を返し、
   OK が押されたら直前にタップされた要素をもう一度クリックして、2回目の呼び出しで結果を返す。 */
(function(){
  var lastTarget = null, allow = null;
  document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('#dlg')) lastTarget = e.target; }, true);
  var dlg = document.getElementById('dlg'), msg = document.getElementById('dlgMsg'),
      inp = document.getElementById('dlgInput'), txt = document.getElementById('dlgText'),
      ok = document.getElementById('dlgOk'), cancel = document.getElementById('dlgCancel');
  var onOk = null;
  function open(m, mode, val){
    msg.textContent = String(m == null ? '' : m);
    inp.classList.toggle('hide', mode !== 'prompt');
    txt.classList.toggle('hide', mode !== 'text');
    cancel.classList.toggle('hide', mode === 'alert' || mode === 'text');
    ok.textContent = (mode === 'alert' || mode === 'text') ? '閉じる' : 'OK';
    if(mode === 'prompt'){ inp.value = val == null ? '' : val; }
    if(mode === 'text'){ txt.value = val; }
    dlg.classList.remove('hide');
    setTimeout(function(){ if(mode === 'prompt') inp.focus(); else if(mode === 'text'){ txt.focus(); txt.select(); } else ok.focus(); }, 30);
  }
  function close(){ dlg.classList.add('hide'); }
  ok.addEventListener('click', function(){ close(); var f = onOk; onOk = null; if(f) f(); });
  cancel.addEventListener('click', function(){ close(); onOk = null; });
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') ok.click(); });
  function replay(t){ if(t && t.isConnected){ t.click(); } allow = null; }
  window.alert = function(m){ open(m, 'alert'); onOk = null; };
  window.confirm = function(m){
    if(allow && allow.kind === 'c' && allow.msg === m){ allow = null; return true; }
    var t = lastTarget; open(m, 'confirm');
    onOk = function(){ allow = {kind:'c', msg:m}; replay(t); };
    return false;
  };
  window.prompt = function(m, def){
    if(allow && allow.kind === 'p' && allow.msg === m){ var v = allow.val; allow = null; return v; }
    if(/コピー/.test(String(m))){ open(m, 'text', def == null ? '' : def); onOk = null; return null; }
    var t = lastTarget; open(m, 'prompt', def);
    onOk = function(){ allow = {kind:'p', msg:m, val:inp.value}; replay(t); };
    return null;
  };
})();
</script>

    var data = window.BOARD_DATA; window.BOARD_DATA = null;
    document.getElementById('loading').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    try{ startEngine(s, data); }catch(e){ alert('起動に失敗しました: '+e.message); renderHub(); }
  };
  sc.onerror = function(){ alert('問題データの読み込みに失敗しました（'+s.name+'）。通信状況を確認して再度お試しください。'); try{ localStorage.removeItem(SKEY); }catch(e){} renderHub(); };
  document.body.appendChild(sc);
}
document.querySelector('.hubtools').addEventListener('click', function(e){
  var b = e.target.closest('[data-hubact]'); if(!b) return;
  var last = null; try{ last = localStorage.getItem(SKEY); }catch(err){}
  var id = (last && byId(last)) ? last : 'naika';
  loadSubject(id, b.dataset.hubact === 'tut' ? {tut:true} : {view:'settings'});
});
document.getElementById('hubCards').addEventListener('click', function(e){
  var b = e.target.closest('[data-subj]'); if(!b) return;
  try{ localStorage.setItem(SKEY, b.dataset.subj); }catch(err){ loadSubject(b.dataset.subj); return; }
  /* エンジンは1ページ1科目で動かすため、選び直しは再読み込みで切り替える */
  location.reload();
});
document.getElementById('subjBtn').addEventListener('click', function(){
  try{ localStorage.removeItem(SKEY); }catch(err){}
  if(location.search){ location.replace(location.pathname); return; }
  location.reload();
});
var q = /[?&]s=([a-z]+)/.exec(location.search);
var want = q ? q[1] : null;
if(!want){ try{ want = localStorage.getItem(SKEY); }catch(e){} }
function boot(){
  if(want && byId(want)){ try{ localStorage.setItem(SKEY, want); }catch(e){} loadSubject(want); }
  else renderHub();
}
var syncedBefore = ''; try{ syncedBefore = localStorage.getItem('bsync-uid') || ''; }catch(e){}
if(syncedBefore && window.BoardSyncGate) window.BoardSyncGate(2500).then(boot, boot); else boot();
})();
</script>

<script>
/* 戻る操作（左スワイプ・戻るボタン）でサイトから抜けないようにする。
   戻ろうとするたびに履歴を積み直して、その場にとどまる。
   ブラウザは操作前の履歴追加を無視することがあるため、最初のタップ時にも積む。 */
(function(){
  if(!window.history || !history.pushState) return;
  function arm(){ try{ history.pushState({board:1}, '', location.href); }catch(e){} }
  arm();
  var armed = false;
  function once(){ if(armed) return; armed = true; arm(); }
  window.addEventListener('pointerdown', once, { once:true, passive:true });
  window.addEventListener('touchstart', once, { once:true, passive:true });
  window.addEventListener('popstate', function(){ arm(); });
})();
</script>
