/* ---------- quiz ---------- */
function getOrder(q){
  var s = S.session;
  var base = q.choices.map(function(_,i){ return i; });
  if(!s) return base;
  s.order = s.order || {};
  if(!s.order[q.id]){ s.order[q.id] = shuffle(base.slice()); save(); }
  return s.order[q.id];
}
/* 演習中に番号から問題を開く。解答済みは見直し、まだの問題は解答中の続きへ戻る */
function quizJump(j){
  var s=S.session; if(!s || s.exam) return;
  if(j < 0 || j > s.res.length || j >= s.ids.length || j === s.i) return;
  if(!s.revealed){ s.pendPick = s.picked.slice(); s.pendOpen = s.open; }     /* 解答中の選択は残しておく */
  s.mapPage = null;
  s.i = j;
  if(j < s.res.length && s.hist && s.hist[j]){ s.revealed = true; s.picked = s.hist[j].slice(); }
  else { s.revealed = false; s.picked = (s.pendPick || []).slice(); s.open = (s.pendOpen != null) ? s.pendOpen : null; }
  save(); renderQuiz(); pageTop();
}
function renderQuiz(){
  var s = S.session, q = curQ();
  if(!s || !q){ go('home'); return; }
  if(s.examResult){ go('result'); return; }
  var ex = s.exam ? rankById(s.exam) : null;
  if(ex && s.deadline && Date.now() > s.deadline){ finishExam(true); return; }
  /* 正解数不明（XX mode）の適用範囲。
     shadowMulti が立っている段位では、複数解答問題だけを対象にする。
     単答問題まで隠すと全問で選ぶ数を疑う必要が生じ、負荷が過大になるため。 */
  var sh = !!(s.shadow) && (!s.shadowMulti || q.correct.length > 1);
  var multi = sh || q.correct.length>1;   /* XX mode 中は全問チェックボックス動作 */
  var p = P(q.id);
  var LS = letters(q.choices.length);
  var order = getOrder(q);
  var ol2dl = {};
  order.forEach(function(oi,j){ ol2dl[LS[oi]] = LS[j]; });
  function toDisp(arr){ return arr.map(function(x){ return ol2dl[x] || x; }).sort().join(', '); }
  var h = '';
  /* Time attack：残り時間を表示し、切れたらその問題は採点せず終了する */
  if(s.taEnd && !s.revealed && Date.now() > s.taEnd){ finishTimeAttack(); return; }
  h += '<div class="qtop">'
     + (s.tut ? '' : '<button class="x" data-act="quit">✕</button>')
     + ((!ex && s.i > 0 && !s.tut) ? '<button class="qback" data-act="back" title="前の問題を見直す">‹</button>' : '')
     + (s.taEnd ? '<span class="tatime" id="taTime">'+fmtLeft(s.taEnd)+'</span>' : '')
     + '<span class="track" style="flex:1"><i style="width:'+Math.round(100*s.i/s.ids.length)+'%"></i></span><span>'+(s.reviewing?'復習 ':'問 ')+(s.i+1)+' / '+s.ids.length+'</span>'
     + (ex ? (function(){ var L=examTimeLeft();
              return '<span class="exbadge">'+esc(ex.name)+'</span>'
                   + (L!==null ? '<span class="extimer'+(L<60000?' warn':'')+'" id="exClock">'+fmtClock(L)+'</span>' : ''); })()
          : (function(){ var n=s.combo||0, t=comboTier(n);
              return (n>=2 ? '<span class="comboMini sk-'+curSkin()+(t?' '+t.cls:'')+'" title="連続正解">'+n+'<i>連</i></span>' : '')
                   + '<span class="mono xpmini" title="現在の合計XP">'+S.xp+' XP</span>'
                   + starBtn('q', q.id, 'star', 'data-act="bm"'); })())
     + '</div>';

  /* 番号から前の問題を開いたときは、その問題の正誤だけを示す（XP・コンボは最新の問題のもの） */
  var pastView = !!(s.revealed && !s.tut && !ex && s.res.length && s.i < s.res.length-1 && s.hist && s.hist[s.i]);
  if(pastView){
    var px = s.res[s.i];
    h += '<div class="banner '+(px.ok?'ok':'ng')+'"><div class="glyph">'+(px.ok?'○':'✕')+'</div><div style="flex:1"><b>'+(px.ok?'正解':'不正解')+'<span class="pastlab">見直し中</span></b><div class="m">'
       + (px.ok?('正解: '+toDisp(q.correct)):('あなたの解答: '+toDisp(s.picked)+' ／ 正解: '+toDisp(q.correct)))+' ／ '+esc(catLabel(q.category))+' ／ #'+q.id+'</div></div></div>';
  } else if(s.revealed){
    var ok = s.res[s.res.length-1] && s.res[s.res.length-1].ok;
    var gain = s.lastGain || {xp:0};
    var bl = BETS[gain.bet] ? BETS[gain.bet].label : '';
    var head = ok ? '正解' : '不正解';
    if(ok && gain.bet==='high') head = '正解（自信あり）';
    if(ok && gain.bet==='low')  head = '正解（自信なし）';
    if(!ok && gain.bet==='high') head = '不正解（自信あり）';
    h += '<div class="banner '+(ok?'ok':'ng')+(gain.bet==='high'?' hi':'')+'"><div class="glyph">'+(ok?'○':'✕')+'</div><div style="flex:1"><b>'+head+'</b><div class="m">'+(ok?('正解: '+toDisp(q.correct)+' ／ '+esc(catLabel(q.category))+' ／ #'+q.id):('あなたの解答: '+toDisp(s.picked)+' ／ 正解: '+toDisp(q.correct)+' ／ #'+q.id))+'</div></div>'
       + '<div class="xpbadge'+(gain.xp<0?' minus':'')+'">'+(gain.xp>=0?'+':'')+gain.xp+' XP</div></div>';
    if(gain.capped) h += '<div class="sub" style="margin:-6px 0 10px">XPは0より下がりません</div>';
    h += '<div class="betrecap"><span class="chipbet '+(BETS[gain.bet]?BETS[gain.bet].cls:'')+'">'+esc(bl)+'</span>'
       + '<span class="calc">'+(gain.base>=0?'+':'')+gain.base+(gain.mult>1?' × '+gain.mult.toFixed(1):'')+(gain.shadow?' <b class="shx">× 1.5</b>':'')+'</span></div>';
    h += comboHtml(gain);
  } else {
    h += '<div style="margin-bottom:11px"><span style="font:600 10.5px var(--mono);color:var(--accent);background:var(--accentSoft);padding:3px 9px;border-radius:6px">'+esc(catLabel(q.category))+'</span>'
       + diffBadge(q)
       + '<span style="font:600 10.5px var(--mono);color:var(--soft);margin-left:8px">#'+q.id+'</span></div>';
  }
  h += '<div style="font:700 16px/1.75 var(--sans);margin-bottom:14px">'+esc(sh && !s.revealed ? stripCount(q.stem) : q.stem)+'</div>';
  var img = q.img || q.image;
  if(img && IMAGES[img]) h += '<img class="qimg" src="data:image/png;base64,'+IMAGES[img]+'" alt="別冊画像" data-act="zoom">';
  if(multi && !s.revealed) h += '<div class="sub" style="margin:-6px 0 10px">'+(sh ? '※ 正しいものをすべて選べ（選ぶ数は非表示）' : '※ '+q.correct.length+'つ選べ')+'</div>';

  /* Chicken mode：選択肢を上から1つずつ開いていく。
     一度見送った肢には戻れないので、迷いを断って決める練習になる。 */
  var chick = !!(s.chicken && !s.exam && !s.revealed);
  if(chick && s.open == null) s.open = 0;
  var needN = q.correct.length;                 /* 選ぶべき数 */
  if(chick){
    /* 残っている肢をすべて選んでも必要数に届かない場合は、
       選択の余地がないので自動で選んだ状態にする。 */
    var restL = [];
    order.forEach(function(oi,j){ if(j >= s.open) restL.push(LS[oi]); });
    var lack = needN - s.picked.length;
    if(lack > 0 && restL.length <= lack){
      restL.forEach(function(L){ if(s.picked.indexOf(L) < 0) s.picked.push(L); });
      s.open = q.choices.length - 1;
      s.autoPick = 1;
      save();
    }
  }
  order.forEach(function(oi,j){
    if(chick && j > s.open) return;             /* まだ開いていない肢は出さない */
    var L = LS[oi], DL = LS[j], cls = 'choice';
    /* 見送りは「開示済みかつ選ばなかった」肢。選んだ肢はそのまま残る。 */
    if(chick && j < s.open && s.picked.indexOf(L) < 0) cls += ' passed';
    if(s.revealed){
      if(q.correct.indexOf(L)>=0) cls += ' ok';
      else if(s.picked.indexOf(L)>=0) cls += ' ng';
      else cls += ' dim';
    } else if(s.picked.indexOf(L)>=0) cls += ' sel';
    h += '<button class="'+cls+'" data-l="'+L+'"><span class="head"><span class="mk">'+DL+'</span><span class="tx">'+esc(q.choices[oi])+'</span></span>';
    if(s.revealed && q.notes && q.notes[L]) h += '<span class="cnote">'+esc(q.notes[L])+'</span>';
    h += '</button>';
  });

  if(chick){
    var total = q.choices.length;
    var got = s.picked.length, left = needN - got;
    var rest = total - (s.open + 1);              /* まだ開いていない肢の数 */
    if(needN > 1){
      h += '<div class="chickneed">'
         + (left > 0 ? 'あと <b>'+left+'</b>つ選んでください' : '必要な数を選びました')
         + '<span class="chicksub">（'+got+' / '+needN+'）</span></div>';
    }
    if(left <= 0){
      h += '<div class="chicklast">'
         + (s.autoPick ? '残りの選択肢は自動で選ばれました。' : '')
         + '下の自信度を選ぶと解答が確定します。</div>';
    } else if(rest > 0){
      h += '<button class="cta chicknext" data-chicknext="1">次の選択肢を見る（'+(s.open+2)+' / '+total+'）</button>';
    } else {
      h += '<div class="chicklast">最後の選択肢です。</div>';
    }
  }

  if(s.revealed){
    h += pointCard(q.explanation, q.exl);
    if(q.deepdive && !s.tut) h += '<details class="deep"><summary>関連知識を読む ＋</summary>'+formatDeepdive(q.deepdive)+'</details>';
    /* 正解した問題でも「自信がなかった」ものを後で見返せるようにする */
    h += saveBtn('q', q.id, 'data-qmark="'+q.id+'"');
    h += '<div class="fbrow"><button class="fbbtn" data-act="feedback" data-qid="'+q.id+'">この問題にメモを残す</button>'
       +  (s.tut ? '' : '<button class="fbbtn" data-act="report" data-qid="'+q.id+'">誤りを報告する</button>') + '</div>';
    var p2 = P(q.id);
    h += '<div class="nextwrap"><div class="nextnote">次にこの問題が出るのは <b>'+fmtIval(p2.ival)+'後</b></div>'
       + '<button class="cta" id="nextBtn">'+((s.i+1<s.ids.length)?'次の問題へ':'結果を見る')+'</button></div>';
  } else {
    var ready = s.picked.length>0;
    if(ex){
      var last = (s.i+1 >= s.ids.length);
      h += '<div class="examnav">'
         + '<button class="exprev" data-exmove="-1"'+(s.i>0?'':' disabled')+'>← 前の問題</button>'
         + (last ? '<button class="cta exfin" data-exfin="1">解答を終える</button>'
                 : '<button class="cta" data-exmove="1">次の問題 →</button>')
         + '</div>';
      if(!last) h += '<button class="ghost exfin2" data-exfin="1" style="margin-top:8px">ここで解答を終える</button>';
      h += '<div class="sub" style="text-align:center;margin-top:10px">'+(ready?'解答を選択済み':'未解答のまま次へ進めます')+' ／ 試験中は正誤・解説は表示されません</div>';
      /* 解答状況の一覧（タップでその問題へ移動） */
      h += '<details class="exmap"><summary>解答状況（'+examAnsweredCount()+' / '+s.ids.length+'問）</summary><div class="exgrid">';
      for(var mi=0; mi<s.ids.length; mi++){
        var done = !!(s.ans && s.ans[mi] && s.ans[mi].length);
        h += '<button class="exdot'+(done?' done':'')+(mi===s.i?' cur':'')+'" data-exjump="'+mi+'">'+(mi+1)+'</button>';
      }
      h += '</div></details>';
    } else {
    var cm = comboMult(s.combo||0) * (s.shadow ? 1.5 : 1);
    h += '<div class="betwrap'+(ready?'':' off')+'">'
       + '<div class="betlead">自信度を選んで解答'+(s.shadow?'<span class="shbadge">XX ×1.5</span>':'')+(s.chicken?'<span class="shbadge mb">CHICKEN ×2.0</span>':'')+'<span class="betlead2">'+(ready?'押すと解答が確定します':'先に選択肢を選んでください')+'</span></div>'
       + '<div class="bets">'
       + ['low','mid','high'].map(function(k){
           var b = BETS[k];
           var win = Math.round(b.win*cm), lose = b.lose;
           return '<button class="bet '+b.cls+'" data-bet="'+k+'"'+(ready?'':' disabled')+'>'
                + '<div class="bl">'+b.label+'</div>'
                + '<div class="bp"><span class="up">+'+win+'</span>'+(lose<0?'<span class="dn">'+lose+'</span>':'<span class="dn zero">±0</span>')+'</div>'
                + '</button>';
         }).join('')
       + '</div></div>';
    }
  }
  /* 解いた問題の番号一覧。正解は緑、不正解は赤で、押すとその問題を見直せる（段位試験では正誤を伏せるので出さない） */
  if(!ex && !s.tut && s.ids.length > 1){
    /* 出すのは解いた問題と解答中の問題だけ。多いときは40問ずつのページに分ける */
    var nShow = Math.min(s.ids.length, s.res.length+1), PG = 40;
    var nPg = Math.ceil(nShow / PG);
    var pg = (s.mapPage != null && s.mapPage < nPg) ? s.mapPage : Math.floor(s.i / PG);
    var nOk = s.res.filter(function(x){ return x.ok; }).length;
    h += '<details class="exmap qmap"'+(s.mapClosed?'':' open')+'><summary>解答状況（○ '+nOk+' ／ ✕ '+(s.res.length-nOk)+'）</summary>';
    if(nPg > 1){
      h += '<div class="qmpages">';
      for(var pj=0; pj<nPg; pj++) h += '<button data-qpage="'+pj+'"'+(pj===pg?' class="on"':'')+'>'+(pj*PG+1)+'–'+Math.min(nShow,(pj+1)*PG)+'</button>';
      h += '</div>';
    }
    h += '<div class="exgrid">';
    for(var qi=pg*PG; qi<Math.min(nShow,(pg+1)*PG); qi++){
      var rr = s.res[qi];
      h += '<button class="exdot'+(rr?(rr.ok?' ok':' ng'):'')+(qi===s.i?' cur':'')+'" data-qjump="'+qi+'">'+(qi+1)+'</button>';
    }
    h += '</div></details>';
  }
  h += '<div style="height:20px"></div>';
  main.innerHTML = h;
  var qmapEl = main.querySelector('.qmap');
  if(qmapEl) qmapEl.addEventListener('toggle', function(){ s.mapClosed = !qmapEl.open; save(); });
  if(ex && s.deadline) startExamClock();

  main.onclick = function(e){
    var a = e.target.closest('[data-act]');
    if(a){
      /* 体験中に受け付けるのは、説明で触れている操作だけに限る。
         それ以外（中断・前へ・画像拡大など）は画面から抜けて詰む恐れがある。 */
      if(s.tut && ['bm','feedback'].indexOf(a.dataset.act) < 0) return;
      if(a.dataset.act==='quit'){ stopExamClock(); save(); go('home'); return; }
      if(a.dataset.act==='back'){
        /* 解答済みの前の問題を見直す。記録は変わらず、解説を読み返すだけ。 */
        if(s.i > 0){ if(!s.revealed){ s.pendPick = s.picked.slice(); s.pendOpen = s.open; } s.i--; s.revealed = true; s.picked = (s.hist && s.hist[s.i]) ? s.hist[s.i].slice() : []; save(); renderQuiz(); }
        return;
      }
      if(a.dataset.act==='bm'){ openTagSheet('q', q.id, renderQuiz); return; }
      if(a.dataset.act==='zoom'){ zoom(a.getAttribute('src')); return; }
      if(a.dataset.act==='feedback'){ openMemo(parseInt(a.dataset.qid,10)); return; }
      if(a.dataset.act==='report'){ window.openContact({ qid: parseInt(a.dataset.qid,10), subj: SUBJ.id, page: 'question' }); return; }
    }
    var qm = e.target.closest('[data-qmark]');
    if(qm){
      openTagSheet('q', parseInt(qm.dataset.qmark,10), renderQuiz); return;
    }
    if(e.target.closest('[data-chicknext]')){
      if(s.open == null) s.open = 0;
      if(s.open < q.choices.length - 1){ s.open++; save(); renderQuiz(); }
      return;
    }
    var c = e.target.closest('[data-l]');
    if(c && !s.revealed){
      var L = c.dataset.l, i = s.picked.indexOf(L);
      if(s.chicken && !s.exam){
        /* 見送った肢は選べず、一度選んだ肢も取り消せない。
           あとから選び直せると「戻れない」前提が崩れるため。 */
        if(c.classList.contains('passed')) return;
        if(i >= 0) return;
      }
      if(multi){ if(i>=0) s.picked.splice(i,1); else s.picked.push(L); }
      else s.picked = [L];
      save(); renderQuiz(); return;
    }
    var qpg = e.target.closest('[data-qpage]');
    if(qpg){ s.mapPage = parseInt(qpg.dataset.qpage,10); save(); renderQuiz(); return; }
    var qj = e.target.closest('[data-qjump]');
    if(qj && !qj.disabled){ quizJump(parseInt(qj.dataset.qjump,10)); return; }
    var em = e.target.closest('[data-exmove]');
    if(em && !em.disabled){ examMove(parseInt(em.dataset.exmove,10)); return; }
    var ej = e.target.closest('[data-exjump]');
    if(ej){ examJump(parseInt(ej.dataset.exjump,10)); return; }
    if(e.target.closest('[data-exfin]')){ examConfirmFinish(); return; }
    var bt = e.target.closest('[data-bet]');
    if(bt && !s.revealed && !bt.disabled){ submitAnswer(bt.dataset.bet); return; }
    if(e.target.closest('#nextBtn')){ nextQuestion(); return; }
  };
  if(s.taEnd && !s.taOver) startTaClock();
  if(typeof tutDemoTick === 'function') tutDemoTick();   /* 使い方の体験中なら案内を進める */
}
function showCert(rec){
  var o = document.createElement('div');
  o.className = 'certoverlay';
  o.innerHTML = certHtml(rec) + '<div class="certclose">タップして閉じる</div>';
  o.onclick = function(){ document.body.removeChild(o); };
  document.body.appendChild(o);
}
function zoom(src){
  var o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px';
  o.innerHTML = '<img src="'+src+'" style="max-width:100%;max-height:100%;object-fit:contain">';
  o.onclick = function(){ document.body.removeChild(o); };
  document.body.appendChild(o);
}

/* ---------- result ---------- */
function renderResult(){
  var s = S.session; if(!s){ go('home'); return; }
  if(s.examResult){ renderExamResult(s); return; }
  var ok = s.res.filter(function(r){ return r.ok; }).length;
  var wrong = s.res.filter(function(r){ return !r.ok; });
  var secs = s.res.reduce(function(a,r){ return a+r.sec; },0);
  var avg = s.res.length ? Math.round(secs/s.res.length) : 0;
  var h = '';
  h += '<div class="kicker" style="margin-top:10px">'+(s.reviewing?'REVIEW COMPLETE':'SESSION COMPLETE')+'</div>';
  h += '<h1 style="margin:6px 0 10px">'+(s.reviewing?'復習が終わりました':'演習が終わりました')+'</h1>';
  h += '<div style="display:flex;align-items:baseline;gap:10px"><span class="big">'+ok+'/'+s.res.length+'</span><span class="mono" style="margin-left:auto;font-weight:700;font-size:20px;color:var(--accent)">'+(s.res.length?Math.round(100*ok/s.res.length):0)+'%</span></div>';
  h += '<div class="sub">1問あたり平均 '+avg+'秒 ／ 合計 '+Math.floor(secs/60)+'分'+(secs%60)+'秒</div>';
  var bc = s.bestCombo||0, bt = comboTier(bc);
  h += '<div class="statrow" style="margin:16px 0 12px"><div class="statbox"><b>+'+(s.gained||0)+'</b><div class="label">獲得XP</div></div>'
     + '<div class="statbox sk-'+curSkin()+(bt?' bcbox '+bt.cls:'')+'"><b>'+bc+'</b><div class="label">最高コンボ'+(bt?' ×'+bt.mult.toFixed(1):'')+'</div></div>'
     + '<div class="statbox"><b>'+S.xp+'</b><div class="label">使えるXP</div></div></div>';
  h += '<div class="soft">'+(s.reviewing ? (wrong.length ? '間違えた'+wrong.length+'問は、あとでもう一度出題されます。' : 'すべて正解です。今回の問題は復習待ちから外れました。') : (wrong.length ? wrong.length+'問間違えました。いま復習しておくと定着しやすくなります。' : '全問正解です。'))+'</div>';
  /* 出題した全問を一覧表示する。正解した問題でも自信がなければ見返せるように、
     結果画面から個別に開けて、★でマークもできる。 */
  if(s.taOver) h += '<div class="tanote">タイムアタック終了。'+(s.taMin||10)+'分で <b>'+s.res.length+'問</b> 解きました。</div>';
  h += '<h2>解いた問題（'+s.res.length+'問）</h2>';
  h += '<div class="reslist">';
  s.res.forEach(function(r){
    var q = QUESTIONS.filter(function(x){ return x.id===r.id; })[0];
    if(!q) return;
    h += '<div class="resli'+(r.ok?'':' ng')+'">'
       +   starBtn('q', q.id, 'resmk', 'data-mark="'+q.id+'"')
       +   '<button class="resopen" data-open="'+q.id+'">'
       +     '<span class="resj">'+(r.ok?'○':'✕')+'</span>'
       +     '<span class="resq">'+esc(q.stem.slice(0,30))+(q.stem.length>30?'…':'')+'</span>'
       +     '<span class="n">'+letterOf(q.category)+'</span>'
       +     '<span class="n" style="color:var(--soft)">#'+q.id+'</span>'
       +   '</button>'
       + '</div>';
  });
  h += '</div>';
  h += '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">';
  if(wrong.length) h += '<button class="cta" data-act="review">間違えた'+wrong.length+'問をいま復習する</button>';
  var marked = s.res.filter(function(r){ return tagsOf('q', r.id).length; });
  if(marked.length) h += '<button class="ghost" data-act="reviewmark">マイリストに保存した'+marked.length+'問を復習する</button>';
  h += '<button class="ghost" data-act="again">'+(S.timeatk ? 'もう一度 '+(S.taMin||10)+'分のタイムアタック' : '同じ条件でもう'+S.count+'問')+'</button><button class="ghost" data-act="home">'+(qaBack?'一問一答に戻る':'ホームに戻る')+'</button></div><div style="height:20px"></div>';
  main.innerHTML = h;

  main.onclick = function(e){
    var mk = e.target.closest('[data-mark]');
    if(mk){
      openTagSheet('q', parseInt(mk.dataset.mark,10), renderResult); return;
    }
    var o = e.target.closest('[data-open]'); if(o){ startSession([parseInt(o.dataset.open,10)], true); return; }
    var a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='review'){ startSession(wrong.map(function(r){ return r.id; }), true); }
    if(a.dataset.act==='reviewmark'){ startSession(marked.map(function(r){ return r.id; }), true); }
    if(a.dataset.act==='again'){ startSession(buildQueue(), false); }
    if(a.dataset.act==='home'){
      S.session=null; save();
      /* 一問一答から来た場合はそこへ戻す */
      if(qaBack){ qaBack = false; qaOn = true; }
      go('home');
    }
  };
}

/* ---------- stats ---------- */
var searchQ = '';
function searchResultsHtml(){
  var qraw = searchQ.trim();
  if(!qraw) return '';
  var idMatch = qraw.match(/^#?(\d+)$/);
  var hits;
  if(idMatch){
    var wantId = parseInt(idMatch[1],10);
    hits = QUESTIONS.filter(function(q){ return q.id===wantId; });
  } else {
    hits = QUESTIONS.filter(function(q){ return (q.stem+q.explanation+(q.exl||'')+(q.deepdive||'')).toLowerCase().indexOf(qraw.toLowerCase())>=0; }).slice(0,20);
  }
  return '<div class="list">' + (hits.length ? hits.map(function(q){
    return '<div class="li" data-open="'+q.id+'"><span style="flex:1">'+esc(q.stem.slice(0,34))+(q.stem.length>34?'…':'')+'</span><span class="n">'+letterOf(q.category)+'</span><span class="n" style="color:var(--soft)">#'+q.id+'</span></div>';
  }).join('') : '<div class="li" style="color:var(--soft)">見つかりませんでした</div>') + '</div>';
}
function renderStats(){
  var seen = 0, ok = 0;
  QUESTIONS.forEach(function(q){ var p=S.prog[q.id]; if(p&&p.seen){ seen++; if(p.lastOk) ok++; } });
  var acc = accByCat();
  var wrongs = QUESTIONS.filter(function(q){ var p=S.prog[q.id]; return p && p.seen && !p.lastOk; });
  var h = '';
  h += '<h1 style="margin:8px 0 14px">成績</h1>';
  h += '<div class="statrow" style="margin-bottom:16px"><div class="statbox"><b>'+seen+'</b><div class="label">解いた問題</div></div><div class="statbox"><b style="color:var(--accent)">'+(seen?Math.round(100*ok/seen):0)+'%</b><div class="label">正答率</div></div><div class="statbox"><b>'+wrongs.length+'</b><div class="label">要復習</div></div></div>';

  h += '<h2>解いた問題数（直近14日）</h2><div class="card" style="margin-bottom:4px">';
  var max = 1, days = [], total7 = 0, todayCount = 0;
  for(var i=13;i>=0;i--){ var d = new Date(Date.now()-i*DAY); var e = S.hist[todayKey(d)] || {a:0,c:0}; days.push(e); if(e.a>max) max=e.a; if(i<7) total7+=e.a; if(i===0) todayCount=e.a; }
  h += '<div class="statrow" style="margin-bottom:12px"><div class="statbox"><b>'+todayCount+'</b><div class="label">今日</div></div><div class="statbox"><b>'+total7+'</b><div class="label">直近7日</div></div></div>';
  h += '<div class="bars">';
  days.forEach(function(e){
    var pct = Math.round(100*e.a/max);
    var col = e.a===0 ? 'var(--barIdle)' : (e.a>=max*0.8 ? 'var(--accent)' : 'var(--barMid)');
    h += '<div class="barcol"><span class="barnum">'+(e.a>0?e.a:'')+'</span><i style="height:'+Math.max(4,pct)+'%;background:'+col+'"></i></div>';
  });
  h += '</div><div class="axis"><span>14日前</span><span>今日</span></div></div>';

  if(S.log && S.log.length){
    h += '<details id="histDetails"><summary>最近解いた問題（'+Math.min(20,S.log.length)+'）</summary><div class="list">';
    S.log.slice(0,20).forEach(function(r){
      var q = QUESTIONS.filter(function(x){ return x.id===r.id; })[0];
      if(!q) return;
      var t = new Date(r.ts);
      var tstr = (t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
      h += '<div class="li" data-open="'+q.id+'">'
         + '<span class="glyph" style="flex:0 0 auto;color:'+(r.ok?'var(--good)':'var(--bad)')+'">'+(r.ok?'○':'✕')+'</span>'
         + '<span class="hlmain"><span class="hlt">'+esc(q.stem.slice(0,60))+'</span>'
         + '<span class="hlm">'+esc(catLabel(q.category))+'　'+tstr+'</span></span>'
         + '</div>';
    });
    h += '</div></details>';
  }

  var touched = CATS.filter(function(c){ return acc[c].seen>0; }).length;
  h += '<details id="heatDetails"'+(heatOpen?' open':'')+'><summary>分野別の正答率（'+touched+' / '+CATS.length+'分野）</summary>';
  h += '<div class="heat" style="margin-top:10px">';
  CATS.forEach(function(c){

<script>
/* 埋め込み表示ではブラウザ標準の confirm / alert / prompt が表示されないため、画面内のダイアログに置き換える。
   confirm と prompt は同期で値を返す必要があるので、最初の呼び出しではダイアログを出して false / null を返し、
   OK が押されたら直前にタップされた要素をもう一度クリックして、2回目の呼び出しで結果を返す。 */
(function(){
  var lastTarget = null, allow = null;
  document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('#dlg')) lastTarget = e.target; }, true);
  var dlg = document.getElementById('dlg'), msg = document.getElementById('dlgMsg'),
      inp = document.getElementById('dlgInput'), txt = document.getElementById('dlgText'),
      ok = document.getElementById('dlgOk'), cancel = document.getElementById('dlgCancel');
  var onOk = null;
  function open(m, mode, val){
    msg.textContent = String(m == null ? '' : m);
    inp.classList.toggle('hide', mode !== 'prompt');
    txt.classList.toggle('hide', mode !== 'text');
    cancel.classList.toggle('hide', mode === 'alert' || mode === 'text');
    ok.textContent = (mode === 'alert' || mode === 'text') ? '閉じる' : 'OK';
    if(mode === 'prompt'){ inp.value = val == null ? '' : val; }
    if(mode === 'text'){ txt.value = val; }
    dlg.classList.remove('hide');
    setTimeout(function(){ if(mode === 'prompt') inp.focus(); else if(mode === 'text'){ txt.focus(); txt.select(); } else ok.focus(); }, 30);
  }
  function close(){ dlg.classList.add('hide'); }
  ok.addEventListener('click', function(){ close(); var f = onOk; onOk = null; if(f) f(); });
  cancel.addEventListener('click', function(){ close(); onOk = null; });
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') ok.click(); });
  function replay(t){ if(t && t.isConnected){ t.click(); } allow = null; }
  window.alert = function(m){ open(m, 'alert'); onOk = null; };
  window.confirm = function(m){
    if(allow && allow.kind === 'c' && allow.msg === m){ allow = null; return true; }
    var t = lastTarget; open(m, 'confirm');
    onOk = function(){ allow = {kind:'c', msg:m}; replay(t); };
    return false;
  };
  window.prompt = function(m, def){
    if(allow && allow.kind === 'p' && allow.msg === m){ var v = allow.val; allow = null; return v; }
    if(/コピー/.test(String(m))){ open(m, 'text', def == null ? '' : def); onOk = null; return null; }
    var t = lastTarget; open(m, 'prompt', def);
    onOk = function(){ allow = {kind:'p', msg:m, val:inp.value}; replay(t); };
    return null;
  };
})();
</script>

function xSecs(body){
  var guard = [];
  body = body.replace(/\[(TABLE|LIST)\][\s\S]*?\[\/\1\]/g, function(t){ guard.push(t); return '\u0000TBL' + (guard.length-1) + '\u0000'; });
  var restore = function(x){ return x.replace(/\u0000TBL(\d+)\u0000/g, function(_,i){ return guard[+i]; }); };
  var out = [], re2 = /(?:^|。|\n|\u0000)([^。：:\n\u0000]{2,12})[：:]/g, ms = [], mm;
  while((mm = re2.exec(body)) !== null){
    var off = mm[0].length - mm[1].length - 1;
    ms.push({ label: mm[1], s: mm.index + off, e: re2.lastIndex });
  }
  if(!ms.length) return [{ label:'', text: restore(body) }];
  if(ms[0].s > 0) out.push({ label:'', text: restore(body.slice(0, ms[0].s)).trim() });
  for(var i=0;i<ms.length;i++){
    var end = (i+1<ms.length) ? ms[i+1].s : body.length;
    out.push({ label: ms[i].label, text: restore(body.slice(ms[i].e, end)).trim() });

}

function xMatch(){
  var q = XE.q.trim().toLowerCase();

  if(/^[\x00-\x7f]+$/.test(q) && q.length && q.length <= 4)
    re = new RegExp('(^|[^A-Za-z])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Za-z])','i');
  var head = [], body = [];
  XE.items.forEach(function(it){
    if(XE.subj && it.s.id !== XE.subj) return;
    if(!q){ head.push({it:it}); return; }
    var hh = re ? (re.test(it.n) || re.test(it.ab)) :
      (it.key.indexOf(q) >= 0 || (qa && it.key.replace(/[\s\-・.]/g,'').indexOf(qa) >= 0));
    if(hh){ head.push({it:it}); return; }
    var pos = -1;
    if(re){ var mm = re.exec(it.plain); if(mm) pos = mm.index + mm[1].length; }
    else pos = it.plain.toLowerCase().indexOf(q);
    if(pos >= 0) body.push({it:it, pos:pos, len:q.length});

  head.sort(function(a,b){

      h += '<div class="xbtns">'
         + '<button class="enquiz xopen" type="button" data-xgo="'+esc(id)+'">'+esc(it.s.short)+'の事典で開く</button>'
         + (it.nq ? '<button class="enquiz" type="button" data-xq="'+esc(id)+'">問題を解く（'+it.nq+'問）</button>' : '')
         + '</div></div>';
    }
    h += '</div>';
  });
  h += '</div>';
  if(all.length > XE.limit) h += '<button class="enquiz xopen" type="button" data-xmore="1" style="margin-top:10px">さらに表示（残り'+(all.length-XE.limit)+'件）</button>';
  el.innerHTML = h;
}
function xChips(){
  var el = document.getElementById('xchips'); if(!el) return;
  var cnt = {}; XE.items.forEach(function(it){ cnt[it.s.id] = (cnt[it.s.id]||0) + 1; });
  el.innerHTML = '<button class="chip'+(XE.subj?'':' on')+'" data-xs="">すべて '+XE.items.length+'</button>'
    + SUBJECTS.map(function(s){ return '<button class="chip'+(XE.subj===s.id?' on':'')+'" data-xs="'+s.id+'">'+esc(s.short)+' '+(cnt[s.id]||0)+'</button>'; }).join('');
}
function openXenc(q){
  XE.q = q || XE.q; XE.open = null; XE.limit = 150;
  var v = document.getElementById('xenc');
  document.getElementById('hub').classList.add('hide');
  v.classList.remove('hide');
  v.innerHTML = '<div class="xtop"><button class="xback" type="button" id="xback">‹ 戻る</button><h1>全科目の事典検索</h1></div>'
    + '<div class="xsub">内科・小児科・救急科の疾患事典をまとめて探せます。略語（AKI、DKAなど）や本文中の語でも検索できます。</div>'
    + '<input class="search" id="xq" type="search" lang="ja" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="疾患名・略語・キーワード（例：敗血症、DKA、川崎病）" value="'+esc(XE.q)+'">'
    + '<div class="xchips" id="xchips"></div><div id="xres"><div class="xsub2">事典を読み込み中…</div></div>';
  window.scrollTo(0, 0);
  var inp = document.getElementById('xq'), composing = false, tm = null;
  var upd = function(){ XE.q = inp.value; XE.open = null; XE.limit = 150; if(XE.items) xResults(); };
  inp.addEventListener('compositionstart', function(){ composing = true; });
  inp.addEventListener('compositionend', function(){ composing = false; upd(); });
  inp.addEventListener('input', function(){ if(composing) return; clearTimeout(tm); tm = setTimeout(upd, 120); });
  document.getElementById('xback').onclick = closeXenc;
  xLoad(function(){ xChips(); xResults(); });
}
function closeXenc(){
  document.getElementById('xenc').classList.add('hide');
  renderHub();
}
function xFind(id){
  for(var i=0;i<XE.items.length;i++){ var it = XE.items[i]; if(it.s.id + '|' + it.n === id) return it; }
  return null;
}
document.getElementById('xenc').addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-xs]'))){ XE.subj = t.dataset.xs; XE.open = null; XE.limit = 150; xChips(); xResults(); return; }
  if((t = e.target.closest('[data-xmore]'))){ XE.limit += 150; xResults(); return; }
  if((t = e.target.closest('[data-xgo]')) || (t = e.target.closest('[data-xq]'))){
    var it = xFind(t.dataset.xgo || t.dataset.xq); if(!it) return;
    try{ localStorage.setItem(SKEY, it.s.id); }catch(err){}
    document.getElementById('xenc').classList.add('hide');
    loadSubject(it.s.id, { enc: it.n, enq: !!t.dataset.xq });
    return;
  }
  if((t = e.target.closest('[data-xen]'))){
    XE.open = (XE.open === t.dataset.xen) ? null : t.dataset.xen;
    xResults();
    var o = document.querySelector('#xenc .encard.open'); if(o) o.scrollIntoView({block:'nearest'});
  }
});
document.getElementById('hubXenc').addEventListener('click', function(){ openXenc(''); });
var XQ = /[?&]xenc=([^&]*)/.exec(location.search);
if(XQ){
  try{ localStorage.removeItem(SKEY); }catch(e){}
  var _renderHub = renderHub, xencBooted = false;
  renderHub = function(){
    _renderHub();
    if(!xencBooted){
      xencBooted = true;
      try{ history.replaceState(null, '', location.pathname); }catch(e){}
      var qv = ''; try{ qv = decodeURIComponent(XQ[1].replace(/\+/g,' ')); }catch(e){}
      openXenc(qv);
    }
  };
}
var q = /[?&]s=([a-z]+)/.exec(location.search);
var want = q ? q[1] : null;
if(!want){ try{ want = localStorage.getItem(SKEY); }catch(e){} }
function boot(){
  if(want && byId(want)){ try{ localStorage.setItem(SKEY, want); }catch(e){} loadSubject(want); }
  else renderHub();
}
var syncedBefore = ''; try{ syncedBefore = localStorage.getItem('bsync-uid') || ''; }catch(e){}
if(syncedBefore && window.BoardSyncGate) window.BoardSyncGate(2500).then(boot, boot); else boot();
})();
</script>

<script>
/* 戻る操作（左スワイプ・戻るボタン）でサイトから抜けないようにする。
   戻ろうとするたびに履歴を積み直して、その場にとどまる。
   ブラウザは操作前の履歴追加を無視することがあるため、最初のタップ時にも積む。 */
(function(){
  if(!window.history || !history.pushState) return;
  function arm(){ try{ history.pushState({board:1}, '', location.href); }catch(e){} }
  arm();
  var armed = false;
  function once(){ if(armed) return; armed = true; arm(); }
  window.addEventListener('pointerdown', once, { once:true, passive:true });
  window.addEventListener('touchstart', once, { once:true, passive:true });
  window.addEventListener('popstate', function(){ arm(); });
})();
</script>
