<script>
/* ホーム（科目選択）画面でも、全科目共通の外観設定（ライト／ダーク・配色・文字）を表示前に反映する */
(function(){
  var g = {}; try{ g = JSON.parse(localStorage.getItem('board-global-v1')) || {}; }catch(e){}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function apply(){
    var t = g.theme || 'auto';
    if(t === 'auto') t = (mq && mq.matches) ? 'dark' : 'light';
    var de = document.documentElement;
    de.setAttribute('data-theme', t);
    var pal = (g.owned || []).indexOf(g.palette) >= 0 ? g.palette : 'default';
    de.setAttribute('data-palette', pal || 'default');
    de.setAttribute('data-fontsize', g.fontsize || 'md');
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#0A0B0D' : '#FFFFFF');
  }
  apply();
  if(mq && mq.addEventListener) mq.addEventListener('change', function(){
    /* 科目画面に入った後はエンジン側が管理する */
    if(!window.BOARD_ENGINE_ON && (g.theme || 'auto') === 'auto') apply();
  });
})();
</script>
<script src="firebase-config.js"></script>
<script>
/* クラウド同期(任意)。バンドルは非同期で読み込み、前回ログイン済みの端末だけ起動前に最大2.5秒だけ同期完了を待つ */
(function(){
  var loaded = new Promise(function(res){
    var s = document.createElement('script'); s.src = 'sync.bundle.js'; s.async = true;
    s.onload = function(){ res(window.BoardSync || null); }; s.onerror = function(){ res(null); };
    document.head.appendChild(s);
  });
  window.BoardSyncGate = function(ms){
    return Promise.race([
      loaded.then(function(b){ return b ? b.startup() : null; }),
      new Promise(function(r){ setTimeout(r, ms); })
    ]);
  };
})();
</script>

<style>

  --bg:#FFFFFF; --card:#FFFFFF; --line:#E2E7EF; --ink:#11161F; --soft:#66707F;
  --accent:#1B5FC1; --accentInk:#FFFFFF; --accentSoft:#E6EEFC;
  --bad:#E02418; --warn:#E8A100; --good:#079257;
  --badTint:#FDECEA; --goodTint:#E3F3EA; --deep:#F3F6FB; --badSoft:rgba(224,36,24,.08);
  --tabbar:#FFFFFF; --tabIdle:#6E7887; --barIdle:#EBEFF6; --barMid:#9DBCEC;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Roboto,"Droid Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0A0B0D; --card:#14171B; --line:#252A30; --ink:#E9ECEE; --soft:#8B949B;
  --accent:#5B9CFF; --accentInk:#06101F; --accentSoft:#16233A;
  --bad:#FF6B58; --warn:#F5B93C; --good:#3FCB92;
  --badTint:#2A1512; --goodTint:#12261F; --deep:#14171B; --badSoft:rgba(255,107,88,.14);
  --tabbar:#101317; --tabIdle:#8A939B; --barIdle:#1D2126; --barMid:#2E4568;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-size-adjust:100%;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
/* 操作要素の長押し選択・ドラッグを抑止（誤操作防止） */
button,.chip,.choice,.li,.heat div,.catgrid label,.conf button,.themebtn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* 入力欄は日本語入力・文字選択を妨げない */
input,textarea,.search{user-select:text!important;-webkit-user-select:text!important;-webkit-touch-callout:default;touch-action:manipulation}
.search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
/* 押した瞬間のフィードバック（tap-highlightを消しているため明示的に付与） */
.choice:active:not(.ok):not(.ng){background:var(--deep);border-color:var(--soft)}
.chip:active,.ghost:active,.catgrid label:active,.conf button:active{background:var(--deep)}
.cta:active:not([disabled]),.primary:active{filter:brightness(.92)}
.list .li:active,.heat div:active{background:var(--deep)}
footer.tabs button:active{opacity:.6}
/* 端末の「文字サイズを大きく」設定と併用してもレイアウトが壊れないように */
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-fontsize="sm"] #app{zoom:0.88}
html[data-fontsize="lg"] #app{zoom:1.18}
html[data-fontsize="xl"] #app{zoom:1.4}

.kicker{font:700 10px var(--mono);letter-spacing:.14em;color:var(--accent)}
.kicker.examk{color:var(--bad)}
.iconbtn{margin-left:auto;font:600 12px var(--mono);color:var(--soft);border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;cursor:pointer}
main{flex:1;padding:4px 18px 18px}
footer.tabs{position:sticky;bottom:0;display:flex;background:var(--tabbar);border-top:1px solid var(--line);padding:9px 0 calc(env(safe-area-inset-bottom) + 14px)}
footer.tabs button{flex:1;min-height:48px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 10.5px var(--sans);color:var(--soft);cursor:pointer}
footer.tabs button .g{width:21px;height:21px}
footer.tabs button.on{color:var(--accent);font-weight:700}
h1{font:700 21px/1.35 var(--sans);margin:4px 0 0}
h2{font:700 12px var(--sans);margin:16px 0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
.row{display:flex;align-items:center;gap:11px}
.sub{font:400 12px var(--sans);color:var(--soft);margin-top:3px}
.label{font:400 10px var(--sans);color:var(--soft);margin-top:2px}
.mono{font-family:var(--mono)}
.track{height:5px;border-radius:3px;background:var(--barIdle);overflow:hidden}

.choice.sel{border-color:var(--accent);background:var(--accentSoft)}

.banner.ok .glyph,.banner.ok b{color:var(--good)} .banner.ng .glyph,.banner.ng b{color:var(--bad)}
.banner b{font:700 15px var(--sans)}
.banner .m{font:500 11px var(--mono);color:var(--soft);margin-top:3px}
.xpbadge{display:inline-flex;align-items:center;gap:5px;background:var(--accentSoft);color:var(--accent);font:700 12px var(--mono);padding:5px 11px;border-radius:20px;flex:0 0 auto}

details.deep{margin-top:10px;border:1px solid var(--line);border-radius:11px;padding:12px 14px}

  background:linear-gradient(90deg,var(--card) 30%,rgba(0,0,0,0)) left/22px 100% no-repeat,
             linear-gradient(270deg,var(--card) 30%,rgba(0,0,0,0)) right/22px 100% no-repeat,
             radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.12),rgba(0,0,0,0)) left/9px 100% no-repeat,

  background-attachment:local,local,scroll,scroll}

.shbadge.mb{background:#B45309;color:#fff}

/* ---- XX mode のトグル ---- */

           border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--sans);text-align:left;min-height:56px}
.shadowtog .stg{flex:1}

.shadowtog .stg b .shtag{display:inline-block;font:800 9.5px var(--mono);letter-spacing:.06em;

   vertical-align:2px;line-height:1}

                 box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s cubic-bezier(.3,1.4,.5,1)}

/* ============ コンボスキン ============ */
/* 各スキンは3色（低・中・高）と最上位のグラデーションを定義する */
.combobar.sk-default{--k1:#C97A16;--k2:#D2691E;--k3:#E02418;--kg:linear-gradient(120deg,#E8A100,#E02418,#8E1BC1,#E8A100);--kb1:rgba(232,161,0,.10);--kb2:rgba(232,120,0,.12);--kb3:var(--badTint);--kl1:rgba(232,161,0,.5);--kl2:rgba(232,120,0,.6);--kl3:var(--bad);--ks2:rgba(232,120,0,.5);--ks3:rgba(224,36,24,.55)}
.combobar.sk-ice{--k1:#3E7FA8;--k2:#1E6FC4;--k3:#0E4FE0;--kg:linear-gradient(120deg,#8FE3FF,#2E8BFF,#5F3BE0,#8FE3FF);--kb1:rgba(62,127,168,.10);--kb2:rgba(30,111,196,.12);--kb3:rgba(14,79,224,.14);--kl1:rgba(62,127,168,.5);--kl2:rgba(30,111,196,.6);--kl3:#0E4FE0;--ks2:rgba(30,111,196,.5);--ks3:rgba(14,79,224,.6)}
.combobar.sk-thunder{--k1:#B8901A;--k2:#D8A200;--k3:#8E1BC1;--kg:linear-gradient(120deg,#FFE44D,#F5B400,#A020F0,#FFE44D);--kb1:rgba(184,144,26,.10);--kb2:rgba(216,162,0,.14);--kb3:rgba(142,27,193,.14);--kl1:rgba(184,144,26,.5);--kl2:rgba(216,162,0,.65);--kl3:#8E1BC1;--ks2:rgba(216,162,0,.6);--ks3:rgba(142,27,193,.6)}
.combobar.sk-sakura{--k1:#C97A9A;--k2:#D9558A;--k3:#C2185B;--kg:linear-gradient(120deg,#FFD1E3,#FF7FAC,#C2185B,#FFD1E3);--kb1:rgba(201,122,154,.10);--kb2:rgba(217,85,138,.12);--kb3:rgba(194,24,91,.13);--kl1:rgba(201,122,154,.5);--kl2:rgba(217,85,138,.6);--kl3:#C2185B;--ks2:rgba(217,85,138,.5);--ks3:rgba(194,24,91,.55)}
.combobar.sk-toxic{--k1:#5E9E12;--k2:#3FAF2A;--k3:#00A86B;--kg:linear-gradient(120deg,#C3FF3D,#3FE05A,#00C2A8,#C3FF3D);--kb1:rgba(94,158,18,.10);--kb2:rgba(63,175,42,.13);--kb3:rgba(0,168,107,.14);--kl1:rgba(94,158,18,.5);--kl2:rgba(63,175,42,.6);--kl3:#00A86B;--ks2:rgba(63,175,42,.55);--ks3:rgba(0,168,107,.6)}
.combobar.sk-rainbow{--k1:#C97A16;--k2:#C2185B;--k3:#6A1BC1;--kg:linear-gradient(120deg,#FF3B30,#FF9500,#FFCC00,#34C759,#00C7BE,#0A84FF,#AF52DE,#FF3B30);--kb1:rgba(201,122,22,.10);--kb2:rgba(194,24,91,.11);--kb3:rgba(106,27,193,.13);--kl1:rgba(201,122,22,.5);--kl2:rgba(194,24,91,.6);--kl3:#6A1BC1;--ks2:rgba(194,24,91,.5);--ks3:rgba(106,27,193,.55)}

/* 変数を使って t1〜t5 の見え方を統一的に定義（スキンを切り替えると全段階が変わる） */
.combobar.t1{border-color:var(--kl1);background:var(--kb1)}
.combobar.t1 .cnum,.combobar.t1 .cmult,.combobar.t1 .clab{color:var(--k1)}
.combobar.t2{border-color:var(--kl2);background:var(--kb2)}
.combobar.t2 .cnum,.combobar.t2 .cmult,.combobar.t2 .clab{color:var(--k2)}
.combobar.t2 .cnum{text-shadow:0 0 14px var(--ks2)}
.combobar.t3{border-color:var(--kl3);background:var(--kb3)}
.combobar.t3 .cnum,.combobar.t3 .cmult,.combobar.t3 .clab{color:var(--k3)}
.combobar.t3 .cnum{font-size:31px;text-shadow:0 0 18px var(--ks3)}
.combobar.t4,.combobar.t5{border:none;color:#fff;background:var(--kg);background-size:300% 100%;
   animation:cIn .34s cubic-bezier(.18,1.5,.42,1) both, cFlow 3s linear infinite .34s}
.combobar.sk-rainbow.t4,.combobar.sk-rainbow.t5{background-size:600% 100%;animation:cIn .34s cubic-bezier(.18,1.5,.42,1) both, cFlow 4.5s linear infinite .34s}
.combobar.t4 .cnum,.combobar.t5 .cnum{color:#fff;font-size:33px;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.combobar.t4 .clab,.combobar.t5 .clab,.combobar.t4 .cmult,.combobar.t5 .cmult{color:#fff}
.combobar.t5 .cnum{font-size:36px}
.combobar.hit .cnum{animation:cPop .5s cubic-bezier(.2,1.7,.4,1) both}
.comboannounce.sk-default.t1,.comboannounce.sk-default.t2{color:#D2691E}
.comboannounce.sk-default.t3,.comboannounce.sk-default.t4,.comboannounce.sk-default.t5{color:#E02418}
.comboannounce.sk-ice.t1,.comboannounce.sk-ice.t2{color:#1E6FC4}
.comboannounce.sk-ice.t3,.comboannounce.sk-ice.t4,.comboannounce.sk-ice.t5{color:#0E4FE0}
.comboannounce.sk-thunder.t1,.comboannounce.sk-thunder.t2{color:#B8901A}
.comboannounce.sk-thunder.t3,.comboannounce.sk-thunder.t4,.comboannounce.sk-thunder.t5{color:#8E1BC1}
.comboannounce.sk-sakura.t1,.comboannounce.sk-sakura.t2{color:#D9558A}
.comboannounce.sk-sakura.t3,.comboannounce.sk-sakura.t4,.comboannounce.sk-sakura.t5{color:#C2185B}
.comboannounce.sk-toxic.t1,.comboannounce.sk-toxic.t2{color:#3FAF2A}
.comboannounce.sk-toxic.t3,.comboannounce.sk-toxic.t4,.comboannounce.sk-toxic.t5{color:#00A86B}
.comboannounce.sk-rainbow.t1,.comboannounce.sk-rainbow.t2{color:#C2185B}
.comboannounce.sk-rainbow.t3,.comboannounce.sk-rainbow.t4,.comboannounce.sk-rainbow.t5{color:#6A1BC1}

.skrow .pname{font:600 13px var(--sans);color:var(--ink);display:block}

details.shop summary .skprev{width:26px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;

.scrollwrap{position:relative;margin:0 -18px 12px}
.scrollwrap::after{content:'';position:absolute;top:0;right:0;bottom:8px;width:34px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg));opacity:1;transition:opacity .18s ease}

.hubtotal{display:flex;gap:10px;margin:0 0 12px}

.hubtotal span{display:block;font:600 11px var(--sans);color:var(--soft)}
.hubtotal b{display:block;margin-top:2px;font:800 20px var(--mono);color:var(--accent)}
.hubtools{display:flex;gap:10px;margin:14px 0 0}
.hubtool{flex:1;font:600 13px var(--sans);padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}

#hub .hubnote{font:400 11.5px/1.6 var(--sans);color:var(--soft);margin-top:18px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--soft);font:600 13px var(--mono);z-index:50}

</style>
</head>

<script>
function startEngine(SUBJ, DATA){
"use strict";
window.BOARD_ENGINE_ON = true;
var RAW = DATA.raw;
var QUESTIONS = RAW.questions || [];
var IMAGES = RAW.images || {};
var ENCYC = RAW.encyc || [];
var CAT_LETTER = SUBJ.catLetter;
var QUICKQA = DATA.quickqa || [];
var CATS = [];
QUESTIONS.forEach(function(q){ if(CATS.indexOf(q.category)<0) CATS.push(q.category); });
CATS.sort(function(a,b){ return (CAT_LETTER[a]||'Z').localeCompare(CAT_LETTER[b]||'Z'); });
function letterOf(c){ return CAT_LETTER[c] || '–'; }
function catLabel(c){ return letterOf(c) + '｜' + c; }
var DAY = 86400000;

var K = 'board-' + SUBJ.id + '-v1';
var S = load();
function load(){
  var d = { theme:'auto', cats:CATS.slice(), count:10, mode:'random', qtype:'all', shadow:false, sound:false, soundVol:0.7, rank:0, examLog:[], xp:0, xpTotal:0, palette:'default', owned:['default'], skin:'default', ownedSkins:['default'], pack:'bell', ownedPacks:['bell'], prog:{}, hist:{}, log:[], marks:{}, tutSeen:0, chicken:0, timeatk:0, taMin:10, bmNames:{1:'セット1',2:'セット2',3:'セット3'}, spacing:{lowMin:10, mid:2, high:9}, fontsize:'md', fontfamily:'default', feedback:[], dailyGoal:20, session:null };
  try{ var r = JSON.parse(localStorage.getItem(K)); if(r) for(var k in r) d[k]=r[k]; }catch(e){}
  /* 見た目・音・チュートリアル既読・XPと買ったもの（色・音色・演出）は全科目で共通。学習データ・段位は科目ごと */
  var SHARED_KEYS = ['theme','fontsize','fontfamily','sound','soundVol','tutSeen','xp','xpTotal','owned','ownedSkins','ownedPacks','palette','skin','pack'];
  try{ var g = JSON.parse(localStorage.getItem('board-global-v1')); if(g) for(var sk in g) if(SHARED_KEYS.indexOf(sk)>=0) d[sk]=g[sk]; }catch(e){}
  if(!d.cats || !d.cats.length) d.cats = CATS.slice();
  d.cats = d.cats.filter(function(c){ return CATS.indexOf(c) >= 0; });   /* 旧バージョンの分野名など無効値を除去 */
  if(!d.cats.length) d.cats = CATS.slice();   /* サニタイズの結果すべて無効だった場合は全選択に戻す */
  if(!d.log) d.log = [];
  if(!d.marks) d.marks = {};   /* あとで見返す問題（問題ID→true） */
  if(!d.bmNames) d.bmNames = {1:'セット1',2:'セット2',3:'セット3'};
  if(!d.spacing) d.spacing = {lowMin:10, mid:2, high:9};
  if(!d.fontsize) d.fontsize = 'md';
  if(!d.fontfamily) d.fontfamily = 'default';
  if(!d.qtype) d.qtype = 'all';
  if(typeof d.shadow !== 'boolean') d.shadow = false;
  if(typeof d.sound !== 'boolean') d.sound = false;
  if(typeof d.soundVol !== 'number') d.soundVol = 0.7;
  if(d.soundVol <= 0.25) d.soundVol = 0.4;
  else if(d.soundVol <= 0.55) d.soundVol = 0.7;
  else if(d.soundVol < 1) d.soundVol = 1.0;
  if(typeof d.rank !== 'number') d.rank = 0;
  if(!d.examLog) d.examLog = [];
  if(typeof d.xpTotal !== 'number') d.xpTotal = d.xp || 0;   /* 既存ユーザーの移行 */
  if(!d.palette) d.palette = 'default';
  if(!d.owned || !d.owned.length) d.owned = ['default'];
  if(d.owned.indexOf('default')<0) d.owned.unshift('default');
  if(!d.skin) d.skin = 'default';
  if(!d.ownedSkins || !d.ownedSkins.length) d.ownedSkins = ['default'];
  if(d.ownedSkins.indexOf('default')<0) d.ownedSkins.unshift('default');
  if(!d.pack) d.pack = 'bell';
  if(!d.ownedPacks || !d.ownedPacks.length) d.ownedPacks = ['bell'];
  if(d.ownedPacks.indexOf('bell')<0) d.ownedPacks.unshift('bell');
  if(!d.feedback) d.feedback = [];
  if(!d.dailyGoal) d.dailyGoal = 20;
  for(var pk in d.prog){ if(d.prog[pk].bm===true) d.prog[pk].bm = 1; if(d.prog[pk].bm===false) d.prog[pk].bm = 0; }
  return d;
}
var saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){ try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} try{ var g={}; ['theme','fontsize','fontfamily','sound','soundVol','tutSeen','xp','xpTotal','owned','ownedSkins','ownedPacks','palette','skin','pack'].forEach(function(k){ g[k]=S[k]; }); localStorage.setItem('board-global-v1', JSON.stringify(g)); }catch(e){} },80); }

var PALETTES = [
  { id:'default',   name:'スタンダード', cost:0,     sw:'#1B5FC1', note:'最初からある色' },
  { id:'mint',      name:'ミント',       cost:900,   sw:'#0E9E86', note:'すっきりした緑' },
  { id:'sakura',    name:'サクラ',       cost:1800,  sw:'#D4457B', note:'やわらかい桜色' },
  { id:'sunset',    name:'サンセット',   cost:3000,  sw:'#E06A16', note:'あたたかい夕焼け' },
  { id:'lavender',  name:'ラベンダー',   cost:4500,  sw:'#7B52D0', note:'落ち着いた紫' },
  { id:'mono',      name:'モノクローム', cost:6500,  sw:'#3A3F47', note:'色を削ぎ落とした黒' },
  { id:'gold',      name:'ゴールド',     cost:12000, sw:'#B8860B', note:'いちばん高い色' }
];
var SKINS = [
  { id:'default', name:'スタンダード', cost:0,    icon:'◆', note:'炎のようなグラデーション' },
  { id:'ice',     name:'アイス',       cost:1400, icon:'❄', note:'青く澄んだ冷たい光' },
  { id:'thunder', name:'サンダー',     cost:2700, icon:'⚡', note:'黄と紫の帯電' },
  { id:'sakura',  name:'桜吹雪',       cost:3900, icon:'✿', note:'淡く舞う桜色' },
  { id:'toxic',   name:'バイオ',       cost:5400, icon:'☣', note:'毒々しい蛍光グリーン' },
  { id:'rainbow', name:'レインボー',   cost:9000, icon:'✦', note:'七色に流れ続ける' }
];
function skinById(id){ for(var i=0;i<SKINS.length;i++) if(SKINS[i].id===id) return SKINS[i]; return SKINS[0]; }
function ownsSkin(id){ return (S.ownedSkins||[]).indexOf(id) >= 0; }
function curSkin(){ return ownsSkin(S.skin) ? (S.skin||'default') : 'default'; }
function paletteById(id){ for(var i=0;i<PALETTES.length;i++) if(PALETTES[i].id===id) return PALETTES[i]; return PALETTES[0]; }
function owns(id){ return (S.owned||[]).indexOf(id) >= 0; }
function applyTheme(){
  var t = S.theme;

function matchesQtype(q){
  if(!S.qtype || S.qtype==='all') return true;
  var qt = q.qtype || 'general';
  return qt === S.qtype;
}
function buildQueue(){
  var pool = QUESTIONS.filter(function(q){ return S.cats.indexOf(q.category)>=0 && matchesQtype(q); });
  var due = dueList().filter(function(q){ return S.cats.indexOf(q.category)>=0 && matchesQtype(q); });
  var fresh = pool.filter(function(q){ return !S.prog[q.id] || !S.prog[q.id].seen; });
  var rest = pool.filter(function(q){ return due.indexOf(q)<0 && fresh.indexOf(q)<0; });
  if(S.mode==='random'){ shuffle(fresh); shuffle(rest); }
  /* 時間で区切る場合は、途中で尽きないよう多めに用意する（1分3問の見当） */
  var take = S.timeatk ? Math.max(30, (S.taMin||10) * 3) : S.count;
  var out = due.concat(fresh, rest).slice(0, take);
  return out.map(function(q){ return q.id; });
}

/* ---------- 効果音（Web Audio で合成。音声ファイルは使わない） ----------
   設計方針：
   ・裸のオシレータを直に鳴らすと電子音（8bit的）になるため、
     マスターにローパス＋ソフトリミッタ＋リバーブ（合成インパルス）を通す
   ・各音は「基音＋倍音」を微妙にデチューンして重ね、木琴/ベル的な倍音構成にする
   ・アタックは短く、リリースは指数減衰で長め（打楽器的な自然さ）
   ・不協和を避け、正解音は完全5度〜オクターブ、コンボは五音音階で上昇
*/
var actx = null, aMaster = null, aVerb = null, aVerbGain = null, aDry = null;
function buildReverb(ac, seconds, decay){
  var rate = ac.sampleRate, len = Math.floor(rate * seconds);
  var buf = ac.createBuffer(2, len, rate);
  for(var ch=0; ch<2; ch++){
    var d = buf.getChannelData(ch);
    for(var i=0;i<len;i++){
      /* 拡散したノイズを指数減衰させた簡易インパルス応答 */
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
  }
  return buf;
}
function audioCtx(){
  if(!S.sound) return null;
  try{
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
      actx = new AC();
      /* --- マスターチェーン --- */
      aMaster = actx.createGain(); aMaster.gain.value = 1;
      var lp = actx.createBiquadFilter();      /* 高域のキツさを落とす */
      lp.type = 'lowpass'; lp.frequency.value = (SUBJ.sound === 'c' ? 4800 : SUBJ.sound === 'b' ? 5200 : 4200); lp.Q.value = 0.4;
      var shelf = actx.createBiquadFilter();   /* 中低域に少し厚みを */
      shelf.type = 'lowshelf'; shelf.frequency.value = 320; shelf.gain.value = 2.5;
      var comp = actx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 24;
      comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.16;
      aMaster.connect(shelf); shelf.connect(lp); lp.connect(comp); comp.connect(actx.destination);
      /* --- 残響（薄く掛けて空間を出す） --- */
      aDry = actx.createGain(); aDry.gain.value = 1; aDry.connect(aMaster);
      try{
        var cv = actx.createConvolver();
        cv.buffer = buildReverb(actx, 1.4, 3.2);
        aVerbGain = actx.createGain(); aVerbGain.gain.value = 0.16;
        aVerb = actx.createGain();
        aVerb.connect(cv); cv.connect(aVerbGain); aVerbGain.connect(aMaster);
      }catch(e){ aVerb = null; }
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function vol(){ return (S.soundVol==null?0.7:S.soundVol) * 0.5; }
function busSend(node, wet){
  node.connect(aDry);
  if(aVerb && wet){ var g = actx.createGain(); g.gain.value = wet; node.connect(g); g.connect(aVerb); }
}
/* 1発の音。倍音を重ねてベル／木琴寄りの響きにする */
function ping(freq, delay, opt){
  var ac = audioCtx(); if(!ac) return;
  opt = opt || {};
  var t   = ac.currentTime + (delay||0);
  if(!isFinite(freq) || freq <= 0) return;   /* 不正な周波数は鳴らさない */
  var dur = opt.dur || 0.5;
  var v   = (opt.vol==null?1:opt.vol) * vol();
  var wet = (opt.wet==null?0.9:opt.wet);
  /* 倍音構成：基音・オクターブ・5度上・2オクターブ（音量は急峻に減衰） */
  var parts = opt.parts || [[1,1],[2,0.34],[3,0.13],[4,0.06]];
  var out = ac.createGain(); out.gain.value = 1; busSend(out, wet);
  parts.forEach(function(p, idx){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = opt.type || 'sine';
    /* わずかにデチューンして厚みを出す */
    var f = freq * p[0] * (1 + (idx? (idx%2?1:-1)*0.0016 : 0));
    o.frequency.setValueAtTime(f, t);
    if(opt.drop) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*opt.drop), t + dur*0.9);
    var pv = Math.max(0.0001, v * p[1]);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(pv, t + (opt.atk || 0.006));
    /* 高次倍音は早く減衰させる＝打鍵直後だけ明るい */
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * (idx? Math.max(0.35, 1-idx*0.22) : 1));
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  });
}
/* ノイズ系（打点のアタック感、抜けの表現） */
function noise(delay, opt){
  var ac = audioCtx(); if(!ac) return;
  opt = opt || {};
  var t = ac.currentTime + (delay||0), dur = opt.dur || 0.12;
  var len = Math.max(1, Math.floor(ac.sampleRate * dur));
  var buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.6);
  var src = ac.createBufferSource(); src.buffer = buf;
  var bp = ac.createBiquadFilter();
  bp.type = opt.filter || 'bandpass';
  bp.frequency.setValueAtTime(opt.f || 2600, t);
  if(opt.f2) bp.frequency.exponentialRampToValueAtTime(Math.max(40,opt.f2), t + dur);
  bp.Q.value = opt.q==null?1.1:opt.q;
  var g = ac.createGain();
  var v = (opt.vol==null?0.5:opt.vol) * vol();
  g.gain.setValueAtTime(Math.max(0.0001,v), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); busSend(g, opt.wet==null?0.5:opt.wet);
  src.start(t); src.stop(t + dur + 0.02);
}

var SOUNDPACKS = [

/* パックごとの音色パラメータ。
   type:波形 / parts:倍音構成 / dur:長さ倍率 / oct:全体の移調(半音でなく倍率) / wet:残響量 */
var PACK_TONE = {
  bell:    { type:'sine',     parts:[[1,1],[2,0.34],[3,0.13],[4,0.06]], dur:1.0, oct:1.0,  wet:1.0, atk:0.006 },
  marimba: { type:'sine',     parts:[[1,1],[4,0.22],[10,0.05]],         dur:0.72, oct:0.5,  wet:0.7, atk:0.004 },
  crystal: { type:'sine',     parts:[[1,1],[2,0.5],[3,0.28],[5,0.12]],  dur:1.45, oct:2.0,  wet:1.5, atk:0.010 },
  retro:   { type:'square',   parts:[[1,1]],                            dur:0.55, oct:1.0,  wet:0.25,atk:0.002 },
  harp:    { type:'triangle', parts:[[1,1],[2,0.28],[3,0.10]],          dur:1.6,  oct:1.0,  wet:1.3, atk:0.012 }
};
/* パックを踏まえて ping を呼ぶ */
function tone(freq, delay, opt){
  var P = PACK_TONE[curPack()] || PACK_TONE.bell;
  opt = opt || {};
  var o = {
    dur: (opt.dur || 0.5) * P.dur,
    vol: opt.vol,
    type: opt.type === 'keep' ? (opt.rawType || P.type) : P.type,
    parts: opt.parts || P.parts,
    atk: P.atk,
    wet: (opt.wet == null ? 0.9 : opt.wet) * P.wet,
    drop: opt.drop
  };
  ping(freq * P.oct, delay, o);
}

/* ---------- ベット（自信度賭け）とコンボ ---------- */
var BETS = {
  low:  { label:'自信なし', win:3,  lose:0,   cls:'low'  },
  mid:  { label:'まあまあ', win:7,  lose:-4,  cls:'mid'  },
  high: { label:'自信あり', win:15, lose:-12, cls:'high' }
};
var COMBO_TIERS = [
  { n:20, mult:2.5, cls:'t5' },
  { n:12, mult:2.0, cls:'t4' },
  { n:8,  mult:1.6, cls:'t3' },
  { n:5,  mult:1.3, cls:'t2' },
  { n:3,  mult:1.15, cls:'t1' }
];
function comboTier(n){
  for(var i=0;i<COMBO_TIERS.length;i++) if(n>=COMBO_TIERS[i].n) return COMBO_TIERS[i];
  return null;
}
function comboMult(n){ var t=comboTier(n); return t ? t.mult : 1; }
/* 開示後のコンボ演出。到達／継続／途切れの3状態 */
function comboHtml(gain){
  if(!gain) return '';
  if(!gain.ok){
    if(gain.brokeAt >= 3){
      return '<div class="combobreak"><span class="cbnum">'+gain.brokeAt+'</span>'
           + '<span class="cbtx">連続正解が途切れました</span></div>';
    }
    return '';
  }
  var n = gain.combo, t = gain.tier;
  if(n < 2) return '';
  var justHit = t && (n === t.n);
  var cls = 'combobar sk-'+curSkin() + (t ? ' '+t.cls : '') + (justHit ? ' hit' : '');
  var h = '<div class="'+cls+'">'
        + '<span class="cnum">'+n+'</span><span class="clab">COMBO</span>';
  if(t) h += '<span class="cmult">×'+t.mult.toFixed(1)+'</span>';
  h += '</div>';
  if(justHit) h += '<div class="comboannounce sk-'+curSkin()+' '+t.cls+'">獲得ポイント ×'+t.mult.toFixed(1)+' に上昇！</div>';
  return h;
}

/* ベットしてから開示する。bet は 'low' | 'mid' | 'high' */
function submitAnswer(bet){
  var s=S.session, q=curQ(); if(!s||!q||s.revealed||!s.picked.length) return;
  if(s.tut){
    /* 使い方の体験。XPも成績も残さず、正誤の表示だけ行う */
    s.bet = bet; s.revealed = true;
    var okT = q.correct.slice().sort().join(',') === s.picked.slice().sort().join(',');
    s.res.push({ id:q.id, ok:okT, bet:bet, gain:0 });
    playSnd(okT ? 'correct' : 'wrong');
    save(); renderQuiz(); return;
  }
  if(!BETS[bet]) bet = 'mid';
  s.hist = s.hist || {};
  s.hist[s.i] = s.picked.slice();   /* 前の問題を見直すときに選択を再現する */
  var cor = q.correct.slice().sort().join(',');
  var mine = s.picked.slice().sort().join(',');
  var ok = cor===mine;
  var p = P(q.id);
  p.seen++; p.lastOk = ok; p.last = Date.now();
  if(ok) p.ok++; else p.ng++;
  var hk = todayKey(); var h = S.hist[hk] || (S.hist[hk]={a:0,c:0}); h.a++; if(ok) h.c++;
  S.log.unshift({ id:q.id, ok:ok, ts:Date.now() });
  if(S.log.length>50) S.log.length = 50;

  /* --- コンボ更新（正解で継続、不正解で途切れる） --- */
  var before = s.combo || 0;
  var broke = 0;
  if(ok){ s.combo = before + 1; }
  else { broke = before; s.combo = 0; }
  if((s.combo||0) > (s.bestCombo||0)) s.bestCombo = s.combo;

  /* --- 得点計算：ベット額 × コンボ倍率（倍率は正解時のみ） --- */
  var b = BETS[bet];
  var base = ok ? b.win : b.lose;
  var mult = ok ? comboMult(s.combo) : 1;
  var shMult = (ok && s.shadow) ? 1.5 : 1;      /* XX mode の正解は1.5倍（失点は据え置き） */
  if(ok && s.chicken) shMult *= 2.0;           /* Chicken mode は選び直せない難しさぶん高め */
  var gain = Math.round(base * mult * shMult);
  var xpBefore = S.xp;
  S.xp = Math.max(0, S.xp + gain);
  var capped = (gain < 0 && (S.xp - xpBefore) > gain);  /* 手持ちが足りず減点しきれなかった */
  gain = S.xp - xpBefore;                               /* 実際に増減した分を表示する */
  if(gain > 0) S.xpTotal = (S.xpTotal||0) + gain;
  s.gained = (s.gained||0) + gain;

  s.lastGain = {
    xp: gain, base: base, mult: mult, bet: bet, ok: ok,
    combo: s.combo, brokeAt: broke,
    tier: ok ? comboTier(s.combo) : null,
    shadow: shMult > 1, capped: capped
  };
  s.lastBet = bet;
  s.revealed = true;
  s.res.push({ id:q.id, ok:ok, bet:bet, sec: Math.round((Date.now()-s.qt)/1000) });

  /* --- 復習間隔：ベットと結果の組合せで決める --- */
  var sp = S.spacing, ival;
  if(ok){
    if(bet==='high')      ival = p.ival>0 ? Math.max(sp.high*0.4, p.ival*2.4) : sp.high;
    else if(bet==='mid')  ival = p.ival>0 ? Math.max(sp.mid*0.5,  p.ival*1.6) : sp.mid;
    else                  ival = sp.mid*0.5;                 /* まぐれ正解は短め */
  } else {
    if(bet==='high')      ival = (sp.lowMin*0.5)/1440;       /* 思い込み＝最短で再出題 */
    else                  ival = sp.lowMin/1440;
  }
  p.ival = ival; p.due = Date.now() + ival*DAY;

  /* 効果音：正誤 → コンボ到達／途切れ の順に鳴らす */
  if(ok){
    playSnd('correct');
    var tNow = comboTier(s.combo);
    if(tNow && s.combo === tNow.n){
      var idx = 0;
      for(var ti=COMBO_TIERS.length-1; ti>=0; ti--){ if(COMBO_TIERS[ti].n===tNow.n){ idx = COMBO_TIERS.length-1-ti; break; } }
      setTimeout(function(){ playSnd('combo', idx); }, 130);
    }
  } else {
    playSnd('wrong');
    if(broke >= 3) setTimeout(function(){ playSnd('broke'); }, 170);
  }
  save(); renderQuiz();
}
/* 次の問題へ進んだら必ず先頭へ。描画直後の高さ変化（百科の閉じ等）でスクロール位置が
   残らないよう、即時と次フレームの2回戻す */
function pageTop(){
  function t(){ window.scrollTo(0,0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
  t();
  if(window.requestAnimationFrame) requestAnimationFrame(function(){ t(); setTimeout(t, 60); });
}
function nextQuestion(){
  if(S.session && S.session.tut) return;   /* 体験中は案内側で進める */
  if(S.session){ S.session.open = 0; S.session.autoPick = 0; }   /* Chicken mode の状態を戻す */
  var sX = S.session;
  if(sX && !sX.exam && sX.hist && sX.hist[sX.i] && sX.i < sX.res.length - 1){
    /* 見直し中。まだ解いていない問題まで進める */
    sX.i++;
    sX.revealed = true;
    sX.picked = (sX.hist[sX.i] || []).slice();
    if(!sX.hist[sX.i]){ sX.revealed = false; sX.picked = []; }
    save(); renderQuiz(); pageTop(); return;
  }
  var s=S.session; if(!s) return;
  if(s.i+1 < s.ids.length){ s.i++; s.picked=[]; s.revealed=false; s.qt=Date.now(); save(); renderQuiz(); pageTop(); }
  else { save(); go('result'); }
}

function renderExamResult(s){
  var er = s.examResult, r = rankById(er.rank);
  var need = Math.ceil(r.n * r.pass / 100);
  var h = '';
  h += '<div class="kicker" style="margin-top:10px">'+(er.passed?'CERTIFIED':'RESULT')+'</div>';
  h += '<div class="examres '+(er.passed?'pass':'fail')+'">'
     + '<div class="ername">'+esc(r.name)+'</div>'
     + '<div class="erjudge">'+(er.passed?'合格':(er.timeUp?'時間切れ':'不合格'))+'</div>'
     + '</div>';
  h += '<div style="display:flex;align-items:baseline;gap:10px;margin-top:14px"><span class="big">'+er.ok+'/'+er.total+'</span>'
     + '<span class="mono" style="margin-left:auto;font-weight:700;font-size:20px;color:'+(er.passed?'var(--good)':'var(--bad)')+'">'+er.rate.toFixed(1)+'%</span></div>';
  h += '<div class="sub">合格ライン '+r.pass+'%（'+need+'問）／ 解答 '+er.answered+'/'+er.total+'問</div>';
  h += '<div class="track" style="margin:12px 0 4px;height:8px"><i style="width:'+Math.min(100,er.rate)+'%;background:'+(er.passed?'var(--good)':'var(--bad)')+'"></i></div>';
  var diff = er.ok - need;
  h += '<div class="sub" style="text-align:right">'
     + (er.passed ? (diff>0 ? '合格ラインを'+diff+'問上回りました' : 'ぎりぎり合格ラインでした')
                  : 'あと'+(-diff)+'問で合格でした')
     + '</div>';

  if(er.passed){
    h += certHtml({ rank:er.rank, ok:er.ok, total:er.total, ts:er.ts||Date.now() });
    var nx = rankById(er.rank+1);
    h += '<div class="soft" style="margin-top:14px"><b>'+esc(r.name)+'</b> を取得しました。'
       + (nx ? '次は <b>'+esc(nx.name)+'</b>（受験料 '+nx.cost+' XP・正答率 '+nx.pass+'%）に挑戦できます。' : 'すべての段位を制覇しました。')
       + '</div>';
  } else {
    h += '<div class="soft" style="margin-top:14px">'+(er.timeUp?'制限時間を過ぎました。':'惜しくも届きませんでした。')
       + ' 間違えた問題は復習リストに入っています。ポイントを貯めて再挑戦できます。</div>';
  }
  var wrong = s.res.filter(function(x){ return !x.ok; });
  if(wrong.length){
    h += '<h2>間違えた'+wrong.length+'問</h2><div class="list">';
    wrong.forEach(function(x){
      var q = null; for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].id===x.id){ q=QUESTIONS[i]; break; }
      if(!q) return;
      h += '<div class="li" data-open="'+q.id+'"><span class="n">#'+q.id+'</span><span style="flex:1">'+esc(q.stem.slice(0,42))+'…</span><span class="mono" style="color:var(--soft)">›</span></div>';
    });
    h += '</div>';
  }
  h += '<div style="margin-top:16px"><button class="ghost" data-act="toRank">ホームへ戻る</button></div>';
  h += '<div style="height:20px"></div>';
  main.innerHTML = h;
  main.onclick = function(e){
    var o = e.target.closest('[data-open]');
    if(o){ S.session=null; save(); startSession([parseInt(o.dataset.open,10)], true); return; }
    if(e.target.closest('[data-act="toRank"]')){ S.session=null; save(); go('rank'); return; }
  };
}

/* ---------- 段位試験の進行 ---------- */
var examClockTimer = null;
function startExamClock(){
  if(examClockTimer) clearInterval(examClockTimer);
  examClockTimer = setInterval(function(){
    var s=S.session;
    if(!s || !s.exam || !s.deadline){ clearInterval(examClockTimer); examClockTimer=null; return; }
    var el = document.getElementById('exClock');
    var L = examTimeLeft();
    if(L<=0){ clearInterval(examClockTimer); examClockTimer=null; finishExam(true); return; }
    if(el){ el.textContent = fmtClock(L); el.classList.toggle('warn', L<60000); }
  }, 1000);
}
function stopExamClock(){ if(examClockTimer){ clearInterval(examClockTimer); examClockTimer=null; } }

/* 試験中は正誤を伏せたまま記録して次へ */
/* 試験は解答を保持しておき、最後にまとめて採点する（前の問題に戻れるようにするため） */
function examStash(){
  var s=S.session; if(!s||!s.exam) return;
  s.ans = s.ans || {};
  if(s.picked && s.picked.length) s.ans[s.i] = s.picked.slice();
  else delete s.ans[s.i];
}
function examLoad(){
  var s=S.session; if(!s) return;
  s.ans = s.ans || {};
  s.picked = (s.ans[s.i] || []).slice();
}
function examMove(d){
  var s=S.session; if(!s||!s.exam) return;
  examStash();
  var t = s.i + d;
  if(t < 0 || t >= s.ids.length) return;
  s.i = t; examLoad(); s.qt = Date.now(); save(); renderQuiz(); pageTop();
}
function examJump(i){
  var s=S.session; if(!s||!s.exam) return;
  examStash(); s.i = i; examLoad(); s.qt = Date.now(); save(); renderQuiz(); pageTop();
}
function examAnsweredCount(){
  var s=S.session; if(!s||!s.ans) return 0;
  var n=0; for(var k in s.ans) if(s.ans[k] && s.ans[k].length) n++;
  return n;
}
/* 「解答を終える」→ 確認してから採点 */
function examConfirmFinish(){
  var s=S.session; if(!s||!s.exam) return;
  examStash(); save();
  var r = rankById(s.exam);
  var done = examAnsweredCount(), blank = s.ids.length - done;

/* 段位試験の出題を組み立てる。
   「複数解答の割合(m)」と「難問の割合(h)」を同時に満たすため、
   問題を 難×複数／難×単一／易中×複数／易中×単一 の4群に分けて必要数ずつ抽出する。
   在庫が不足する群があれば、近い性質の群から補って必ずn問を揃える。 */
function buildExam(r){
  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  var hard = function(q){ return q.difficulty === 'hard'; };
  var multi = function(q){ return q.correct.length > 1; };
  var HM=[], HS=[], EM=[], ES=[];
  QUESTIONS.forEach(function(q){
    var h = hard(q), m = multi(q);
    if(h && m) HM.push(q); else if(h) HS.push(q); else if(m) EM.push(q); else ES.push(q);
  });
  HM=shuffle(HM); HS=shuffle(HS); EM=shuffle(EM); ES=shuffle(ES);

  var n = r.n;
  var needM = Math.min(n, Math.round(n * (r.m || 0)));   /* 複数解答の目標数 */
  var needH = Math.min(n, Math.round(n * (r.h || 0)));   /* 難問の目標数 */
  /* 難かつ複数の必要数：両者の重なりは最低 needM+needH-n、最大は min(needM,needH) */
  var hm = Math.max(0, needM + needH - n);
  hm = Math.min(hm, HM.length, needM, needH);
  /* 残りを各群から取る */
  var hs = Math.min(needH - hm, HS.length);
  var em = Math.min(needM - hm, EM.length);
  var es = n - hm - hs - em;

  var out = [];
  function take(arr, k){ for(var i=0;i<k && i<arr.length;i++) out.push(arr[i].id); }
  take(HM, hm); take(HS, hs); take(EM, em); take(ES, Math.max(0, es));

  /* 不足分は残りの全問から補う */
  if(out.length < n){
    var used = {};
    out.forEach(function(id){ used[id]=1; });
    var rest = shuffle(QUESTIONS.filter(function(q){ return !used[q.id]; }));
    for(var i=0; i<rest.length && out.length<n; i++) out.push(rest[i].id);
  }
  return shuffle(out).slice(0, n);
}

var studyQ = '', studyCat = '', studyOpen = null, studyChildOpen = null, studyChipLeft = 0;
function encycSecs(body){
  /* [TABLE]〜[/TABLE] の内部は見出しとして分割しない（表内の「検査|…」等を誤検出しないため） */
  var guard = [];
  body = body.replace(/\[TABLE\][\s\S]*?\[\/TABLE\]/g, function(t){
    guard.push(t); return '\u0000TBL' + (guard.length-1) + '\u0000';
  });
  var restore = function(s){
    return s.replace(/\u0000TBL(\d+)\u0000/g, function(_,i){ return guard[+i]; });
  };
  var out = [], re2 = /(?:^|。|\n)([^。：:\n]{2,12})[：:]/g, ms = [], mm;
  /* 見出しは固定語に限らず、文頭または句点直後の短い語＋「：」を節見出しとして扱う */
  while((mm = re2.exec(body)) !== null){
    var off = mm[0].length - mm[1].length - 1;   /* 直前の「。」や改行の分 */
    ms.push({ label: mm[1], s: mm.index + off, e: re2.lastIndex });
  }
  if(!ms.length) return [{ label:'', text: restore(body) }];
  if(ms[0].s > 0) out.push({ label:'', text: restore(body.slice(0, ms[0].s)).trim() });
  for(var i=0;i<ms.length;i++){
    var end = (i+1<ms.length) ? ms[i+1].s : body.length;
    out.push({ label: ms[i].label, text: restore(body.slice(ms[i].e, end)).trim() });
  }
  return out.filter(function(x){ return x.text; });
}
function studyList(){
  var q = studyQ.trim().toLowerCase();
  var qa = q.replace(/[\s\-・.]/g,'');
  var ascii = /^[\x00-\x7f]+$/.test(q);
  var re = null;
  if(ascii && q.length <= 4){
    /* 短い英字の略称（IE・SAH等）は単語単位で照合し、die・hierなどの偶然一致を除く */
    re = new RegExp('(^|[^A-Za-z])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Za-z])','i');
  }
  var out = [], rest = [];
  ENCYC.forEach(function(e){
    if(studyCat && e.c !== studyCat) return;
    if(!q){ out.push(e); return; }
    var nm = e.n.toLowerCase();
    var ab = (e.ab||'').toLowerCase();
    var head = re ? (re.test(e.n) || re.test(e.ab||'')) :
      (nm.indexOf(q) >= 0 || ab.indexOf(q) >= 0 ||
      (qa && (nm.replace(/[\s\-・.]/g,'').indexOf(qa) >= 0 || ab.replace(/[\s\-・.]/g,'').indexOf(qa) >= 0)));
    if(head){ out.push(e); return; }
    var body = stripMark(e.b);
    if(re ? re.test(body) : body.toLowerCase().indexOf(q) >= 0) rest.push(e);
  });
  return q ? out.concat(rest) : out;
}
/* マウス／トラックパッドでも横に動かせるようにする */
function bindChipScroll(el){
  if(!el) return;
  var wrap = el.parentNode;
  function updateFade(){
    if(!wrap || !wrap.classList) return;
    var atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
    wrap.classList.toggle('atend', atEnd);
  }
  updateFade();
  el.addEventListener('scroll', updateFade, { passive:true });

  /* 縦ホイールを横スクロールに変換（トラックパッドの横スワイプはそのまま活かす） */
  el.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if(el.scrollWidth <= el.clientWidth) return;
    var before = el.scrollLeft;
    el.scrollLeft += e.deltaY;
    if(el.scrollLeft !== before) e.preventDefault();
  }, { passive:false });

  /* マウスでつかんで動かす */
  var down=false, sx=0, sl=0, moved=0;
  el.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'touch') return;
    down=true; moved=0; sx=e.clientX; sl=el.scrollLeft; el.classList.add('dragging');
  });
  el.addEventListener('pointermove', function(e){
    if(!down) return;
    var dx = e.clientX - sx;
    if(Math.abs(dx) > 3){ moved = 1; el.scrollLeft = sl - dx; e.preventDefault(); }
  });
  function endDrag(){ if(!down) return; down=false; el.classList.remove('dragging'); setTimeout(function(){ moved=0; },0); }
  el.addEventListener('pointerup', function(e){
    /* ドラッグ後のクリックでカテゴリが切り替わってしまうのを防ぐ */
    if(moved){ e.stopPropagation(); e.preventDefault(); }
    endDrag();
  }, true);
  el.addEventListener('pointerleave', endDrag);
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('click', function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* 子項目は親の中に入れ子で表示する。
   検索時は、子がヒットした場合もその親を表示して文脈ごと辿れるようにする。 */
function childrenOf(name){
  return ENCYC.filter(function(x){ return x.p === name; });
}
function encBodyHtml(e){
  var h = '';
  encycSecs(e.b).forEach(function(sec){
    if(sec.label) h += '<div class="enlabel">'+esc(sec.label)+'</div>';
    h += renderContentWithTable(sec.text);   /* [TABLE]記法を表として描画 */
  });
  h += '<button class="enquiz" data-enq="'+esc(e.n)+'">この項目の問題を解く（'+e.q.length+'問）</button>';

function studyResultsHtml(){
  var h = '';
  var hit = studyList();
  /* 子だけがヒットした場合は親を表に出す（親は重複させない） */
  var shown = [], seen = {};
  hit.forEach(function(e){
    var top = e.p ? (ENCYC.filter(function(x){ return x.n === e.p; })[0] || e) : e;
    if(seen[top.n]) return;
    seen[top.n] = 1; shown.push(top);
  });
  var nChild = hit.filter(function(e){ return e.p; }).length;
  h += '<div class="sub" style="margin:0 2px 8px">'+shown.length+'件'
     + (nChild ? '<span style="margin-left:8px;color:var(--soft)">（関連項目 '+nChild+' 件を含む）</span>' : '')
     + '</div>';
  if(!shown.length){
    h += '<div class="soft">該当する項目がありません。別の言葉で探してみてください。</div>';
  }
  h += '<div class="enlist">';
  shown.slice(0,400).forEach(function(e){
    var op = studyOpen === e.n;
    var kids = childrenOf(e.n);
    h += '<div class="encard'+(op?' open':'')+'">'
       + '<button class="enhead" data-en="'+esc(e.n)+'">'
       +   '<span class="enname">'+esc(e.n)+(e.ab?'<span class="enab">'+esc(e.ab)+'</span>':'')+'</span>'
       +   (kids.length ? '<span class="enkids">'+kids.length+'</span>' : '')
       +   '<span class="encat">'+esc(letterOf(e.c))+'</span>'
       +   '<span class="enchev">'+(op?'▴':'▾')+'</span>'
       + '</button>';
    if(op){
      h += '<div class="enbody">' + encBodyHtml(e);
      kids.forEach(function(k){
        var kop = studyChildOpen === k.n;
        h += '<div class="enchild'+(kop?' open':'')+'">'
           + '<button class="enchead" data-enc="'+esc(k.n)+'">'
           +   '<span class="enctag">関連</span>'
           +   '<span class="encname">'+esc(k.n)+(k.ab?'<span class="enab">'+esc(k.ab)+'</span>':'')+'</span>'
           +   '<span class="enchev">'+(kop?'▴':'▾')+'</span>'
           + '</button>'
           + (kop ? '<div class="encbody">' + encBodyHtml(k) + '</div>' : '')
           + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  if(shown.length>400) h += '<div class="sub" style="margin:10px 2px">上位400件を表示しています。検索で絞り込んでください。</div>';
  return h;
}

function bindStudy(){

    stc.scrollLeft = studyChipLeft;                     /* 再描画前の位置を復元 */
    stc.addEventListener('scroll', function(){ studyChipLeft = stc.scrollLeft; }, { passive:true });

    });
    si.addEventListener('input', function(){

function studyClick(ev){
    /* 案内の表示中は実画面を操作させない */
    if(document.getElementById('tutOverlay')) return;
    var sc = ev.target.closest('[data-scat]');
    if(sc){
      studyCat = sc.dataset.scat; studyOpen = null;
      var el2 = document.getElementById('stcat');
      if(el2) studyChipLeft = el2.scrollLeft;
      Array.prototype.forEach.call(document.querySelectorAll('#stcat .chip'), function(b2){
        b2.classList.toggle('on', b2.dataset.scat === studyCat);
      });
      refreshStudyResults();
      return;
    }
    var eq = ev.target.closest('[data-enq]');
    if(eq){
      var nm = eq.dataset.enq, hit = null;
      for(var i=0;i<ENCYC.length;i++) if(ENCYC[i].n===nm){ hit = ENCYC[i]; break; }
      if(hit && hit.q.length) startSession(hit.q.slice(), false);
      return;
    }
    var enc = ev.target.closest('[data-enc]');
    if(enc){
      studyChildOpen = (studyChildOpen===enc.dataset.enc) ? null : enc.dataset.enc;
      refreshStudyResults();
      var opc = document.querySelector('.enchild.open');
      if(opc) opc.scrollIntoView({ block:'nearest' });

    if(en){
      if(studyOpen !== en.dataset.en) studyChildOpen = null;   /* 別の親を開いたら子は閉じる */
      studyOpen = (studyOpen===en.dataset.en) ? null : en.dataset.en;
      refreshStudyResults();
      var op = document.querySelector('.encard.open');
      if(op) op.scrollIntoView({ block:'nearest' });
      return;
    }
}

/* ---------- home ---------- */
/* ---------- 写真の保存（IndexedDB） ----------
   画像は容量が大きく localStorage に入らないため、別領域に保存する。
   保存前に長辺1280pxへ縮小し、JPEG品質72%に落として容量を抑える。 */
var PHOTO_DB = 'board-photos-' + SUBJ.id, PHOTO_STORE = 'photos';
function photoDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(PHOTO_DB, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore(PHOTO_STORE); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function photoPut(key, blob){
  return photoDB().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction(PHOTO_STORE, 'readwrite');
      t.objectStore(PHOTO_STORE).put(blob, key);
      t.oncomplete = function(){ res(key); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function photoGet(key){
  return photoDB().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction(PHOTO_STORE, 'readonly');
      var q = t.objectStore(PHOTO_STORE).get(key);
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function photoDel(key){
  return photoDB().then(function(db){
    return new Promise(function(res){
      var t = db.transaction(PHOTO_STORE, 'readwrite');
      t.objectStore(PHOTO_STORE).delete(key);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ res(); };
    });
  });
}
/* 縮小・圧縮してから保存する */
function shrinkImage(file, maxSide, quality){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height, m = Math.max(w, h);
      if(m > maxSide){ var r = maxSide / m; w = Math.round(w*r); h = Math.round(h*r); }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? res(b) : rej(new Error('変換に失敗しました')); }, 'image/jpeg', quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

/* ---------- メモ（文章＋写真） ---------- */
var memoQid = null, memoPhotos = [], memoIdx = null;
function openMemo(qid, idx){
  memoQid = qid; memoIdx = (idx == null ? null : idx);
  var cur = (idx != null) ? S.feedback[idx] : null;
  memoPhotos = cur && cur.photos ? cur.photos.slice() : [];
  var o = document.createElement('div');
  o.id = 'memoOverlay';
  o.innerHTML = '<div class="memobox">'
    + '<div class="memohead"><span class="memot">問題 #'+qid+' のメモ</span>'
    + '<button class="x" data-memo="close">✕</button></div>'
    + '<textarea id="memoText" class="memoarea" placeholder="覚えておきたいこと、間違えた理由、あとで確認したい点など。"></textarea>'
    + '<div class="memophotos" id="memoPhotos"></div>'
    + '<label class="memoadd">写真を追加'
    + '<input type="file" accept="image/*" id="memoFile" style="display:none">'
    + '</label>'
    + '<div class="memobtns">'
    + (idx != null ? '<button class="ghost memodel" data-memo="delete">削除</button>' : '')
    + '<button class="cta" data-memo="save">保存</button></div>'
    + '</div>';
  document.body.appendChild(o);
  document.getElementById('memoText').value = cur ? cur.text : '';
  renderMemoPhotos();
  document.getElementById('memoFile').onchange = function(ev){
    var f = ev.target.files && ev.target.files[0];
    if(!f) return;
    if(memoPhotos.length >= 4){ alert('写真は1つのメモに4枚までです。'); return; }
    shrinkImage(f, 1280, 0.72).then(function(blob){
      var key = 'p' + Date.now() + Math.floor(Math.random()*1000);
      return photoPut(key, blob).then(function(){ memoPhotos.push(key); renderMemoPhotos(); });
    }).catch(function(err){ alert('写真を保存できませんでした。\n' + (err && err.message ? err.message : '')); });
    ev.target.value = '';
  };
  o.onclick = function(e){
    var t = e.target.closest('[data-memo]');
    if(t){
      var a = t.dataset.memo;
      if(a === 'close'){ closeMemo(); return; }
      if(a === 'save'){ saveMemo(); return; }
      if(a === 'delete'){
        if(!confirm('このメモを削除しますか？')) return;
        (S.feedback[memoIdx].photos || []).forEach(function(k){ photoDel(k); });
        S.feedback.splice(memoIdx, 1); save(); closeMemo(); renderStats(); return;
      }
      return;
    }
    var rm = e.target.closest('[data-memorm]');
    if(rm){
      var k = rm.dataset.memorm;
      memoPhotos = memoPhotos.filter(function(x){ return x !== k; });
      photoDel(k); renderMemoPhotos(); return;
    }
    var zm = e.target.closest('[data-memozoom]');
    if(zm){ zoom(zm.dataset.memozoom); return; }
  };
}
function renderMemoPhotos(){
  var box = document.getElementById('memoPhotos');
  if(!box) return;
  if(!memoPhotos.length){ box.innerHTML = ''; return; }
  box.innerHTML = memoPhotos.map(function(k){
    return '<div class="memoph" data-k="'+k+'"><img alt="添付写真"><button class="memorm" data-memorm="'+k+'">✕</button></div>';
  }).join('');
  memoPhotos.forEach(function(k){
    photoGet(k).then(function(blob){
      if(!blob) return;
      var el = box.querySelector('[data-k="'+k+'"] img');
      if(el){ var u = URL.createObjectURL(blob); el.src = u; el.dataset.url = u; }
    });
  });
}
function saveMemo(){
  var txt = (document.getElementById('memoText').value || '').trim();
  if(!txt && !memoPhotos.length){ alert('文章か写真を入力してください。'); return; }
  if(memoIdx != null){
    S.feedback[memoIdx].text = txt;
    S.feedback[memoIdx].photos = memoPhotos.slice();
  } else {
    S.feedback.push({ id: memoQid, text: txt, photos: memoPhotos.slice(), ts: Date.now() });
  }
  save(); closeMemo();
  if(S.tab === 'stats') renderStats();
}
function closeMemo(){
  var o = document.getElementById('memoOverlay');
  if(o){
    o.querySelectorAll('img[data-url]').forEach(function(i){ URL.revokeObjectURL(i.dataset.url); });
    o.remove();
  }
  memoQid = null; memoPhotos = []; memoIdx = null;
}

/* 成績タブのメモ一覧に、保存済みの写真を読み込んで並べる */
function loadFbThumbs(){

}

function tutSpot(sel){
  var old = document.getElementById('tutSpot'); if(old) old.remove();
  if(!sel) return null;
  var el = document.querySelector(sel);
  if(!el) return null;
  tutLock(false);
  if(el.closest('#tabs')){
    window.scrollTo(0, 0);              /* 下部タブは画面に固定。本文は先頭に戻す */
  } else {
    el.scrollIntoView({ block:'start' });
    window.scrollBy(0, -70);            /* 見出しが隠れないよう少し戻す */
  }
  tutLock(true);
  var r = el.getBoundingClientRect();
  /* 対象が長いと説明カードを置く場所がなくなるので、
     画面の上側だけを光らせて下half を説明用に空ける。 */
  var H = window.innerHeight, top = r.top, bottom = r.bottom;
  /* 対象が長い場合は上から maxH 分だけを光らせ、残りは説明カードの場所に充てる。
     見出しが見えるよう、切るのは常に下側にする。 */
  var maxH = H * 0.50;
  if(bottom - top > maxH) bottom = top + maxH;
  if(top < 8) top = 8;
  var d = document.createElement('div');
  d.id = 'tutSpot';
  d.style.cssText = 'position:fixed;pointer-events:none;z-index:201;border-radius:14px;'
    + 'left:'+(r.left-6)+'px;top:'+(top-6)+'px;width:'+(r.width+12)+'px;height:'+(bottom-top+12)+'px;'
    + 'box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:2px solid var(--accent)';
  document.body.appendChild(d);
  return { top:top, bottom:bottom, left:r.left, right:r.right, width:r.width, height:bottom-top };
}

function tutFitCard(r){
  var card = document.querySelector('#tutOverlay .tutcard');
  var spot = document.getElementById('tutSpot');
  if(!card) return;
  var H = window.innerHeight, ch = card.offsetHeight, M = 10, G = 14;
  var below = r.bottom + G, above = r.top - ch - G, top;
  if(below + ch + M <= H)      top = below;        /* 対象の下に置ける */
  else if(above >= M)          top = above;        /* 対象の上に置ける */
  else {
    /* どちらにも収まらない。光らせる範囲を削ってカードの場所を作る。 */
    top = H - ch - M;
    if(spot && top < r.bottom){
      var nb = top - G;                            /* 枠の新しい下端 */
      if(nb - r.top < 90){                         /* 削りすぎる場合は上に置く */
        top = M; nb = null;
        spot.style.top = (Math.max(M, top + ch + G)) + 'px';
        spot.style.height = Math.max(60, H - (top + ch + G) - M) + 'px';
      } else {
        spot.style.height = (nb - (r.top - 6)) + 'px';
      }
    }
  }
  card.style.top = Math.round(Math.max(M, top)) + 'px';
  card.style.bottom = 'auto';
}
/* 体験中は案内カードを画面下端に固定し、そのぶん本文を上へ逃がす。
   カードが選択肢に重なって押せなくなるのを防ぐ。 */

var qaBack = false;
var qaOn = false, qaQ = null, qaPicked = null, qaFlip = false, qaShowEnc = 0;
var qaStat = { ok:0, ng:0, streak:0, best:0, gain:0 };
var qaRecent = [];
function qaPool(){
  var pool = QUICKQA.slice();
  if(S.cats && S.cats.length && S.cats.length < CATS.length){
    var f = pool.filter(function(x){ return S.cats.indexOf(x.c) >= 0; });
    if(f.length >= 5) pool = f;
  }
  return pool;
}
function qaNext(){
  var pool = qaPool();
  if(!pool.length){ qaQ = null; return; }
  var fresh = pool.filter(function(x){ return qaRecent.indexOf(x.id) < 0; });
  if(fresh.length < 2){ qaRecent = []; fresh = pool; }
  qaQ = fresh[Math.floor(Math.random()*fresh.length)];
  qaRecent.push(qaQ.id);
  if(qaRecent.length > Math.min(30, pool.length - 1)) qaRecent.shift();
  qaPicked = null;
  qaShowEnc = 0;
  qaFlip = Math.random() < 0.5;   /* 2択のA/Bを入れ替えて位置で覚えられないようにする */
}
function qaHtml(){
  /* 中断ボタンと進捗は演習画面と同じく枠の外・左上に置き、操作を統一する */
  var h = '<div class="qahead">'
     + '<button class="x" data-qaclose="1">✕</button>'
     + '<span class="qatitle">一問一答</span>'
     + (qaStat.streak>1 ? '<span class="qastreak">'+qaStat.streak+'連続</span>' : '')
     + '<span class="qascore">'+qaStat.ok+' / '+(qaStat.ok+qaStat.ng)+'</span></div>';
  h += '<div class="qabox">';
  if(!qaQ){ h += '<div class="soft">出題できる問題がありません。</div></div>'; return h; }
  h += '<div class="qameta"><span class="qacat">'+esc(letterOf(qaQ.c))+'</span>'
     + '<span class="qakind">'+(qaQ.t==='ox' ? '○×' : '2択')+'</span>'
     + '<span class="qanum">Q'+qaQ.id+'</span></div>';
  h += '<div class="qasent">'+esc(qaQ.q)+'</div>';

  var opts;
  if(qaQ.t === 'ox'){
    opts = [{ v:'T', label:'○' }, { v:'F', label:'×' }];
  } else {
    opts = qaFlip ? [{ v:'B', label:qaQ.B }, { v:'A', label:qaQ.A }]
                  : [{ v:'A', label:qaQ.A }, { v:'B', label:qaQ.B }];
  }
  var ansV = (qaQ.t==='ox') ? (qaQ.a ? 'T' : 'F') : qaQ.a;
  h += '<div class="qaopts'+(qaQ.t==='ox'?' ox':'')+'">';
  opts.forEach(function(o){
    var cls = 'qaopt';
    if(qaPicked){
      if(o.v === ansV) cls += ' ok';
      else if(o.v === qaPicked) cls += ' ng';
      else cls += ' dim';
    }
    h += '<button class="'+cls+'" data-qa="'+o.v+'">'+esc(o.label)+'</button>';
  });
  h += '</div>';

  if(qaPicked){
    var right = qaPicked === ansV;
    h += '<div class="qares '+(right?'r':'w')+'">'+(right?'正解':'不正解')
       + (right && qaStat.gain ? '<span class="qaxp">+'+qaStat.gain+' XP</span>' : '')
       + '</div>';
    h += '<div class="qaexp">'+esc(qaQ.e)+'</div>';
    /* 鑑別問題では両方の疾患を確認できるよう、関連知識を並べて出す */
    var keys = [];
    if(qaQ.kA || qaQ.kB){
      /* 画面に並んでいる選択肢と同じ順で関連知識を出す */
      var kk = qaFlip ? [qaQ.kB, qaQ.kA] : [qaQ.kA, qaQ.kB];
      kk.forEach(function(x){ if(x && keys.indexOf(x) < 0) keys.push(x); });
    }
    if(!keys.length && qaQ.k) keys.push(qaQ.k);
    keys.forEach(function(kn, ki){
      var ent = ENCYC.filter(function(x){ return x.n === kn; })[0];
      if(!ent) return;
      var open = (qaShowEnc === ki + 1);
      h += '<button class="qaenc'+(open?' open':'')+'" data-qaenc="'+(ki+1)+'">'
         + '<span class="qaencn">'+esc(ent.n)+'</span>'
         + '<span class="qaencc">'+esc(letterOf(ent.c))+'</span>'
         + '<span class="qaencv">'+(open?'▴':'▾')+'</span></button>';
      if(open){
        h += '<div class="qaencbody">';
        encycSecs(ent.b).forEach(function(sec){
          if(sec.label) h += '<div class="enlabel">'+esc(sec.label)+'</div>';
          h += renderContentWithTable(sec.text);
        });
        if(ent.q.length) h += '<button class="qalink" data-qaquiz="'+esc(ent.n)+'">この疾患の問題を解く（'+ent.q.length+'問）</button>';
        h += '</div>';
      }
    });
    h += '<button class="cta qanext" data-qanext="1">次の問題</button>';
  }
  h += '</div>';
  return h;
}

    /* 案内の表示中は実画面を操作させない。体験ステップだけは例外。 */
    if(document.getElementById('tutOverlay') && !(S.session && S.session.tut)) return;
    var t = e.target;
    var o = t.closest('[data-open]'); if(o){ startSession([parseInt(o.dataset.open,10)], true); return; }
    var exa = t.closest('[data-exam]');
    if(exa){ var rr = rankById(parseInt(exa.dataset.exam,10)); if(rr) startExam(rr); return; }
    var chip = t.closest('[data-count]'); if(chip){ S.count = parseInt(chip.dataset.count,10); S.timeatk = 0; save(); renderHome(); return; }
    var shd = t.closest('[data-shadow]');
    if(shd){ S.shadow = !S.shadow; if(S.shadow) S.chicken = 0; save(); renderHome(); return; }
    var chk = t.closest('[data-chicken]');
    if(chk){ S.chicken = S.chicken ? 0 : 1; if(S.chicken) S.shadow = false; save(); renderHome(); return; }
    var tam = t.closest('[data-tamin]');
    if(tam){ S.timeatk = 1; S.taMin = parseInt(tam.dataset.tamin,10); save(); renderHome(); return; }
    var md = t.closest('[data-mode]'); if(md){ S.mode = md.dataset.mode; save(); renderHome(); return; }
    var qt = t.closest('[data-qtype]'); if(qt){ S.qtype = qt.dataset.qtype; save(); renderHome(); return; }
    var ca = t.closest('[data-catall]');
    if(ca){
      S.cats = ca.dataset.catall==='1' ? CATS.slice() : [];
      save();
      main.querySelectorAll('input[data-cat]').forEach(function(cb){ cb.checked = S.cats.indexOf(cb.dataset.cat)>=0; });
      var sumEl = main.querySelector('details summary');
      if(sumEl) sumEl.textContent = '分野を選ぶ（'+S.cats.length+'/'+CATS.length+'）';
      return;
    }
    var tr = t.closest('[data-train]'); if(tr){ var c=tr.dataset.train; var ids = QUESTIONS.filter(function(q){ return q.category===c; }).map(function(q){return q.id;}); startSession(shuffle(ids).slice(0,S.count), false); return; }
if(e.target.closest('[data-act="qa"]')){ qaOn = true; qaNext(); renderHome(); window.scrollTo(0,0); return; }
    if(e.target.closest('[data-qaclose]')){ qaOn = false; renderHome(); return; }
    var qo = e.target.closest('[data-qa]');
    if(qo && !qaPicked && qaQ){
      qaPicked = qo.dataset.qa;
      var ansV = (qaQ.t==='ox') ? (qaQ.a ? 'T' : 'F') : qaQ.a;
      if(qaPicked === ansV){
        qaStat.ok++; qaStat.streak++;
        if(qaStat.streak > qaStat.best) qaStat.best = qaStat.streak;
        /* 2択なので配点は控えめ。10連続ごとに少しだけ加算する */
        var g = 1 + ((qaStat.streak % 10 === 0) ? 5 : 0);
        S.xp += g; S.xpTotal += g; save();
        qaStat.gain = g;
        playSnd(qaStat.streak % 10 === 0 ? 'combo' : 'correct', 1);
      } else { qaStat.ng++; qaStat.streak = 0; qaStat.gain = 0; playSnd('wrong'); }
      renderHome(); return;
    }
    if(e.target.closest('[data-qanext]')){ qaNext(); renderHome(); pageTop(); return; }
    var qe = e.target.closest('[data-qaenc]');
    if(qe){
      var idx = parseInt(qe.dataset.qaenc, 10);
      qaShowEnc = (qaShowEnc === idx) ? 0 : idx;   /* 同じものを押したら閉じる */
      renderHome(); return;
    }
    var qq = e.target.closest('[data-qaquiz]');
    if(qq){
      var nm = qq.dataset.qaquiz;
      var ent = ENCYC.filter(function(x){ return x.n === nm; })[0];
      if(ent && ent.q.length){ qaBack = true; qaOn = false; startSession(shuffle(ent.q.slice()), true); }
      return;
    }
    var a = t.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='start'){ startSession(buildQueue(), false); }
    if(a.dataset.act==='resume'){ go('quiz'); }
        if(a.dataset.act==='marked'){
      var mids = Object.keys(S.marks||{}).map(function(x){ return parseInt(x,10); })
                  .filter(function(id){ return QUESTIONS.some(function(q){ return q.id===id; }); });
      if(mids.length) startSession(shuffle(mids), true);
      return;
    }
if(a.dataset.act==='due'){ var d = dueList().map(function(q){return q.id;}); if(!d.length){ alert('いま期限が来ている復習はありません。'); return; } startSession(d.slice(0,50), true); }
  };
  main.onchange = function(e){
    var cb = e.target.closest('input[data-cat]'); if(!cb) return;
    var c = cb.dataset.cat, i = S.cats.indexOf(c);
    if(cb.checked && i<0) S.cats.push(c);
    if(!cb.checked && i>=0) S.cats.splice(i,1);
    save();
}

/* ---------- quiz ---------- */
function getOrder(q){
  var s = S.session;
  var base = q.choices.map(function(_,i){ return i; });
  if(!s) return base;
  s.order = s.order || {};
  if(!s.order[q.id]){ s.order[q.id] = shuffle(base.slice()); save(); }
  return s.order[q.id];
}
function renderQuiz(){
  var s = S.session, q = curQ();
  if(!s || !q){ go('home'); return; }
  var ex = s.exam ? rankById(s.exam) : null;
  if(ex && s.deadline && Date.now() > s.deadline){ finishExam(true); return; }
  /* 正解数不明（XX mode）の適用範囲。
     shadowMulti が立っている段位では、複数解答問題だけを対象にする。
     単答問題まで隠すと全問で選ぶ数を疑う必要が生じ、負荷が過大になるため。 */
  var sh = !!(s.shadow) && (!s.shadowMulti || q.correct.length > 1);
  var multi = sh || q.correct.length>1;   /* XX mode 中は全問チェックボックス動作 */
  var p = P(q.id);
  var LS = letters(q.choices.length);
  var order = getOrder(q);
  var ol2dl = {};
  order.forEach(function(oi,j){ ol2dl[LS[oi]] = LS[j]; });
  function toDisp(arr){ return arr.map(function(x){ return ol2dl[x] || x; }).sort().join(', '); }
  var h = '';
  /* Time attack：残り時間を表示し、切れたらその問題は採点せず終了する */
  if(s.taEnd && !s.revealed && Date.now() > s.taEnd){ finishTimeAttack(); return; }
  h += '<div class="qtop">'
     + (s.tut ? '' : '<button class="x" data-act="quit">✕</button>')
     + ((!ex && s.i > 0 && !s.tut) ? '<button class="qback" data-act="back" title="前の問題を見直す">‹</button>' : '')
     + (s.taEnd ? '<span class="tatime" id="taTime">'+fmtLeft(s.taEnd)+'</span>' : '')
     + '<span class="track" style="flex:1"><i style="width:'+Math.round(100*s.i/s.ids.length)+'%"></i></span><span>'+(s.reviewing?'復習 ':'問 ')+(s.i+1)+' / '+s.ids.length+'</span>'
     + (ex ? (function(){ var L=examTimeLeft();
              return '<span class="exbadge">'+esc(ex.name)+'</span>'
                   + (L!==null ? '<span class="extimer'+(L<60000?' warn':'')+'" id="exClock">'+fmtClock(L)+'</span>' : ''); })()
          : (function(){ var n=s.combo||0, t=comboTier(n);
              return (n>=2 ? '<span class="comboMini sk-'+curSkin()+(t?' '+t.cls:'')+'" title="連続正解">'+n+'<i>連</i></span>' : '')
                   + '<span class="mono xpmini" title="現在の合計XP">'+S.xp+' XP</span>'
                   + '<button class="star'+(p.bm?' on c'+p.bm:'')+'" data-act="bm">'+(p.bm?'★':'☆')+'</button>'; })())
     + '</div>';

  if(s.revealed){
    var ok = s.res[s.res.length-1] && s.res[s.res.length-1].ok;
    var gain = s.lastGain || {xp:0};
    var bl = BETS[gain.bet] ? BETS[gain.bet].label : '';
    var head = ok ? '正解' : '不正解';
    if(ok && gain.bet==='high') head = 'ズバリ正解';
    if(ok && gain.bet==='low')  head = 'まぐれ正解';
    if(!ok && gain.bet==='high') head = '思い込みでした';
    h += '<div class="banner '+(ok?'ok':'ng')+(gain.bet==='high'?' hi':'')+'"><div class="glyph">'+(ok?'○':'✕')+'</div><div style="flex:1"><b>'+head+'</b><div class="m">'+(ok?('正解: '+toDisp(q.correct)+' ／ '+esc(catLabel(q.category))+' ／ #'+q.id):('あなた: '+toDisp(s.picked)+' ／ 正解: '+toDisp(q.correct)+' ／ #'+q.id))+'</div></div>'
       + '<div class="xpbadge'+(gain.xp<0?' minus':'')+'">'+(gain.xp>=0?'+':'')+gain.xp+' XP</div></div>';
    if(gain.capped) h += '<div class="sub" style="margin:-6px 0 10px">ポイントは0より減りません</div>';
    h += '<div class="betrecap"><span class="chipbet '+(BETS[gain.bet]?BETS[gain.bet].cls:'')+'">'+esc(bl)+'</span>'
       + '<span class="calc">'+(gain.base>=0?'+':'')+gain.base+(gain.mult>1?' × '+gain.mult.toFixed(1):'')+(gain.shadow?' <b class="shx">× 1.5</b>':'')+'</span></div>';
    h += comboHtml(gain);
  } else {
    h += '<div style="margin-bottom:11px"><span style="font:600 10.5px var(--mono);color:var(--accent);background:var(--accentSoft);padding:3px 9px;border-radius:6px">'+esc(catLabel(q.category))+'</span>'
       + diffBadge(q)
       + '<span style="font:600 10.5px var(--mono);color:var(--soft);margin-left:8px">#'+q.id+'</span></div>';
  }
  h += '<div style="font:700 16px/1.75 var(--sans);margin-bottom:14px">'+esc(sh && !s.revealed ? stripCount(q.stem) : q.stem)+'</div>';
  var img = q.img || q.image;
  if(img && IMAGES[img]) h += '<img class="qimg" src="data:image/png;base64,'+IMAGES[img]+'" alt="別冊画像" data-act="zoom">';
  if(multi && !s.revealed) h += '<div class="sub" style="margin:-6px 0 10px">'+(sh ? '※ 正しいものをすべて選べ（数は示されません）' : '※ '+q.correct.length+'つ選べ')+'</div>';

  /* Chicken mode：選択肢を上から1つずつ開いていく。
     一度見送った肢には戻れないので、迷いを断って決める練習になる。 */
  var chick = !!(s.chicken && !s.exam && !s.revealed);
  if(chick && s.open == null) s.open = 0;
  var needN = q.correct.length;                 /* 選ぶべき数 */
  if(chick){
    /* 残っている肢をすべて選んでも必要数に届かない場合は、
       選択の余地がないので自動で選んだ状態にする。 */
    var restL = [];
    order.forEach(function(oi,j){ if(j >= s.open) restL.push(LS[oi]); });
    var lack = needN - s.picked.length;
    if(lack > 0 && restL.length <= lack){
      restL.forEach(function(L){ if(s.picked.indexOf(L) < 0) s.picked.push(L); });
      s.open = q.choices.length - 1;
      s.autoPick = 1;
      save();
    }
  }
  order.forEach(function(oi,j){
    if(chick && j > s.open) return;             /* まだ開いていない肢は出さない */
    var L = LS[oi], DL = LS[j], cls = 'choice';
    /* 見送りは「開示済みかつ選ばなかった」肢。選んだ肢はそのまま残る。 */
    if(chick && j < s.open && s.picked.indexOf(L) < 0) cls += ' passed';
    if(s.revealed){
      if(q.correct.indexOf(L)>=0) cls += ' ok';
      else if(s.picked.indexOf(L)>=0) cls += ' ng';
      else cls += ' dim';
    } else if(s.picked.indexOf(L)>=0) cls += ' sel';
    h += '<button class="'+cls+'" data-l="'+L+'"><span class="head"><span class="mk">'+DL+'</span><span class="tx">'+esc(q.choices[oi])+'</span></span>';
    if(s.revealed && q.notes && q.notes[L]) h += '<span class="cnote">'+esc(q.notes[L])+'</span>';
    h += '</button>';
  });

  if(chick){
    var total = q.choices.length;
    var got = s.picked.length, left = needN - got;
    var rest = total - (s.open + 1);              /* まだ開いていない肢の数 */
    if(needN > 1){
      h += '<div class="chickneed">'
         + (left > 0 ? 'あと <b>'+left+'</b> つ選びます' : '選び終えました')
         + '<span class="chicksub">（'+got+' / '+needN+'）</span></div>';
    }
    if(left <= 0){
      h += '<div class="chicklast">'
         + (s.autoPick ? '残りは自動で選ばれました。' : '')
         + '下の「自信」を選んで解答してください。</div>';
    } else if(rest > 0){
      h += '<button class="cta chicknext" data-chicknext="1">次の選択肢を見る（'+(s.open+2)+' / '+total+'）</button>';
    } else {
      h += '<div class="chicklast">最後の選択肢です。</div>';
    }
  }

  if(s.revealed){
    h += '<div class="pointcard"><div class="tag">ここだけ暗記ポイント</div><p>'+esc(q.explanation)+'</p></div>';
    if(q.deepdive && !s.tut) h += '<details class="deep"><summary>関連知識を読む ＋</summary>'+formatDeepdive(q.deepdive)+'</details>';
    /* 正解した問題でも「自信がなかった」ものを後で見返せるようにする */
    var mkOn = !!(S.marks && S.marks[q.id]);
    h += '<button class="qmark'+(mkOn?' on':'')+'" data-qmark="'+q.id+'">'
       +   '<span>'+(mkOn?'★':'☆')+'</span>'+(mkOn?'あとで見返す（登録済み）':'あとで見返す')
       + '</button>';
    h += '<button class="fbbtn" data-act="feedback" data-qid="'+q.id+'">この問題にメモを残す</button>';
    var p2 = P(q.id);
    h += '<div class="nextwrap"><div class="nextnote">次にこの問題が出るのは <b>'+fmtIval(p2.ival)+'後</b></div>'
       + '<button class="cta" id="nextBtn">'+((s.i+1<s.ids.length)?'次の問題へ':'結果を見る')+'</button></div>';
  } else {
    var ready = s.picked.length>0;
    if(ex){
      var last = (s.i+1 >= s.ids.length);
      h += '<div class="examnav">'
         + '<button class="exprev" data-exmove="-1"'+(s.i>0?'':' disabled')+'>← 前の問題</button>'
         + (last ? '<button class="cta exfin" data-exfin="1">解答を終える</button>'
                 : '<button class="cta" data-exmove="1">次の問題 →</button>')
         + '</div>';
      if(!last) h += '<button class="ghost exfin2" data-exfin="1" style="margin-top:8px">ここで解答を終える</button>';
      h += '<div class="sub" style="text-align:center;margin-top:10px">'+(ready?'解答を選択済み':'未解答のまま次へ進めます')+'／ 試験中は正誤・解説は表示されません</div>';
      /* 解答状況の一覧（タップでその問題へ移動） */
      h += '<details class="exmap"><summary>解答状況（'+examAnsweredCount()+' / '+s.ids.length+'問）</summary><div class="exgrid">';
      for(var mi=0; mi<s.ids.length; mi++){
        var done = !!(s.ans && s.ans[mi] && s.ans[mi].length);
        h += '<button class="exdot'+(done?' done':'')+(mi===s.i?' cur':'')+'" data-exjump="'+mi+'">'+(mi+1)+'</button>';
      }
      h += '</div></details>';
    } else {
    var cm = comboMult(s.combo||0) * (s.shadow ? 1.5 : 1);
    h += '<div class="betwrap'+(ready?'':' off')+'">'
       + '<div class="betlead">どれくらい自信がある？'+(s.shadow?'<span class="shbadge">XX ×1.5</span>':'')+(s.chicken?'<span class="shbadge mb">CHICKEN ×2.0</span>':'')+'<span class="betlead2">'+(ready?'選んで解答':'まず選択肢を選ぶ')+'</span></div>'
       + '<div class="bets">'
       + ['low','mid','high'].map(function(k){
           var b = BETS[k];
           var win = Math.round(b.win*cm), lose = b.lose;
           return '<button class="bet '+b.cls+'" data-bet="'+k+'"'+(ready?'':' disabled')+'>'
                + '<div class="bl">'+b.label+'</div>'
                + '<div class="bp"><span class="up">+'+win+'</span>'+(lose<0?'<span class="dn">'+lose+'</span>':'<span class="dn zero">±0</span>')+'</div>'
                + '</button>';
         }).join('')
       + '</div></div>';
    }
  }
  h += '<div style="height:20px"></div>';
  main.innerHTML = h;
  if(ex && s.deadline) startExamClock();

  main.onclick = function(e){
    var a = e.target.closest('[data-act]');
    if(a){
      /* 体験中に受け付けるのは、説明で触れている操作だけに限る。
         それ以外（中断・前へ・画像拡大など）は画面から抜けて詰む恐れがある。 */
      if(s.tut && ['bm','feedback'].indexOf(a.dataset.act) < 0) return;
      if(a.dataset.act==='quit'){ stopExamClock(); save(); go('home'); return; }
      if(a.dataset.act==='back'){
        /* 解答済みの前の問題を見直す。記録は変わらず、解説を読み返すだけ。 */
        if(s.i > 0){ s.i--; s.revealed = true; s.picked = (s.hist && s.hist[s.i]) ? s.hist[s.i].slice() : []; save(); renderQuiz(); }
        return;
      }
      if(a.dataset.act==='bm'){ p.bm = ((p.bm||0)+1) % 4; save(); renderQuiz(); return; }
      if(a.dataset.act==='zoom'){ zoom(a.getAttribute('src')); return; }
      if(a.dataset.act==='feedback'){ openMemo(parseInt(a.dataset.qid,10)); return; }
    }
    var qm = e.target.closest('[data-qmark]');
    if(qm){
      var qid = parseInt(qm.dataset.qmark,10);
      if(!S.marks) S.marks = {};
      if(S.marks[qid]) delete S.marks[qid]; else S.marks[qid] = 1;
      save(); renderQuiz(); return;
    }
    if(e.target.closest('[data-chicknext]')){
      if(s.open == null) s.open = 0;
      if(s.open < q.choices.length - 1){ s.open++; save(); renderQuiz(); }
      return;
    }
    var c = e.target.closest('[data-l]');
    if(c && !s.revealed){
      var L = c.dataset.l, i = s.picked.indexOf(L);
      if(s.chicken && !s.exam){
        /* 見送った肢は選べず、一度選んだ肢も取り消せない。
           あとから選び直せると「戻れない」前提が崩れるため。 */
        if(c.classList.contains('passed')) return;
        if(i >= 0) return;
      }
      if(multi){ if(i>=0) s.picked.splice(i,1); else s.picked.push(L); }
      else s.picked = [L];
      save(); renderQuiz(); return;
    }
    var em = e.target.closest('[data-exmove]');
    if(em && !em.disabled){ examMove(parseInt(em.dataset.exmove,10)); return; }
    var ej = e.target.closest('[data-exjump]');
    if(ej){ examJump(parseInt(ej.dataset.exjump,10)); return; }
    if(e.target.closest('[data-exfin]')){ examConfirmFinish(); return; }
    var bt = e.target.closest('[data-bet]');
    if(bt && !s.revealed && !bt.disabled){ submitAnswer(bt.dataset.bet); return; }
    if(e.target.closest('#nextBtn')){ nextQuestion(); return; }
  };
  if(s.taEnd && !s.taOver) startTaClock();
  if(typeof tutDemoTick === 'function') tutDemoTick();   /* 使い方の体験中なら案内を進める */
}
